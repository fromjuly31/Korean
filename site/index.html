<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="학생들과 함께 만드는 우리 반 우리말 사전">
  <title>우리말 바로쓰기 | 참여형 국어 수업</title>
  <style>
    :root {
      --primary: #315f5b;
      --primary-dark: #244945;
      --primary-soft: #e8f3ef;
      --accent: #ee8065;
      --accent-soft: #fff0ea;
      --ink: #20302f;
      --muted: #71807d;
      --line: #e3e5df;
      --surface: #fffefa;
      --background: #f7f5ef;
      --danger: #b8423f;
      --success: #24715d;
      --warning: #9b671d;
      --shadow: 0 16px 42px rgba(48, 72, 68, .08);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--background); }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(246,190,150,.18), transparent 25%),
        radial-gradient(circle at 91% 12%, rgba(163,207,191,.2), transparent 28%),
        radial-gradient(circle at 82% 82%, rgba(202,187,230,.13), transparent 22%),
        var(--background);
      background-attachment: fixed;
      font: 16px/1.65 Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      word-break: keep-all; overflow-wrap: anywhere; overflow-x: hidden;
    }
    body.home-page {
      background:
        radial-gradient(circle at 86% 9%, rgba(178,205,191,.32), transparent 29%),
        radial-gradient(circle at 4% 42%, rgba(238,188,107,.12), transparent 23%),
        #f3f2ec;
    }
    #app { width: 100%; min-width: 0; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .62; }
    .hidden { display: none !important; }
    .shell { width: min(1240px, calc(100% - 36px)); margin: 0 auto; padding: 30px 0 60px; }
    .app-header { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
    .header-actions { margin-left: auto; }
    .brand-mark { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 15px; background: var(--primary); color: white; font-size: 25px; font-weight: 900; }
    .app-header h1 { margin: 0; font-size: clamp(25px, 3vw, 32px); line-height: 1.25; letter-spacing: -.03em; }
    .eyebrow { margin: 0 0 2px; color: var(--primary); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
    .admin-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 22px; padding: 7px; background: #e9ebf1; border-radius: 17px; }
    .admin-nav.admin-nav-four { grid-template-columns: repeat(4, 1fr); }
    .nav-btn { min-height: 52px; border: 0; border-radius: 12px; color: #50596b; background: transparent; font-weight: 800; font-size: 16px; }
    .nav-btn.active { color: var(--primary); background: white; box-shadow: 0 3px 12px rgba(40, 50, 80, .08); }
    .card { background: var(--surface); border: 1px solid rgba(215, 220, 230, .9); border-radius: var(--radius); box-shadow: var(--shadow); }
    .panel { padding: 24px; }
    .hero { padding: 28px; margin-bottom: 20px; background: linear-gradient(135deg, #fff, #f0f4ff); }
    .hero h2, .section-head h2 { margin: 0 0 7px; font-size: clamp(24px, 3vw, 30px); letter-spacing: -.03em; line-height: 1.3; }
    .hero p, .section-head p { margin: 0; color: var(--muted); }
    .section-head { display: flex; justify-content: space-between; gap: 18px; align-items: end; margin: 28px 0 14px; }
    .section-head.compact { margin-top: 0; }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 23px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 17px; border: 1px solid var(--line); border-radius: 12px; background: white; color: var(--ink); text-decoration: none; font-weight: 750; transition: transform .15s, box-shadow .15s, border-color .15s; }
    .btn:hover { transform: translateY(-1px); border-color: #b9c0cd; box-shadow: 0 7px 18px rgba(30, 40, 70, .08); }
    .btn-primary { border-color: var(--primary); background: var(--primary); color: white; }
    .btn-primary:hover { border-color: var(--primary-dark); background: var(--primary-dark); }
    .btn-danger { border-color: #f0c8ce; color: var(--danger); background: #fff8f9; }
    .btn-soft { border-color: #d8e1ff; color: var(--primary); background: var(--primary-soft); }
    .btn-lg { min-height: 54px; padding: 13px 21px; font-size: 17px; }
    .btn-block { width: 100%; }
    .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .stat { padding: 18px; }
    .stat span { display: block; color: var(--muted); font-size: 14px; font-weight: 700; }
    .stat strong { display: block; margin-top: 5px; font-size: 27px; letter-spacing: -.04em; }
    .charts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
    .mini-chart { padding: 18px; }
    .mini-chart h3 { margin: 0 0 14px; font-size: 16px; }
    .bar-row { display: grid; grid-template-columns: minmax(60px, 1fr) 2fr auto; gap: 8px; align-items: center; margin: 10px 0; font-size: 13px; }
    .bar-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { height: 8px; border-radius: 99px; background: #edf0f5; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: inherit; background: var(--primary); }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    .search { flex: 1 1 260px; position: relative; }
    .search input { padding-left: 43px; }
    .search::before { content: "⌕"; position: absolute; left: 15px; top: 9px; color: var(--muted); font-size: 22px; }
    .field, input[type="text"], input[type="email"], input[type="password"], input[type="search"], textarea, select {
      width: 100%; min-height: 48px; border: 1px solid #cfd5df; border-radius: 12px; background: white; color: var(--ink); padding: 11px 13px; outline: 0;
    }
    textarea { min-height: 126px; resize: vertical; }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(49, 87, 213, .13); }
    label.field-label { display: block; margin: 16px 0 7px; font-weight: 800; }
    .filter-group { display: flex; gap: 7px; flex-wrap: wrap; }
    .filter-btn { min-height: 42px; border: 1px solid var(--line); border-radius: 99px; background: white; padding: 8px 15px; font-weight: 750; color: #4c5566; }
    .filter-btn.active { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    .badge { display: inline-flex; align-items: center; min-height: 27px; padding: 3px 9px; border-radius: 99px; font-size: 13px; font-weight: 800; }
    .badge-slang { color: #ad3544; background: #fff0f2; }
    .badge-trend { color: #795000; background: #fff4d8; }
    .badge-loan { color: #206359; background: #e9f8f4; }
    .badge-approved { color: var(--success); background: #e8f7f1; }
    .badge-pending { color: #6e7480; background: #eff1f4; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #eceef2; vertical-align: middle; }
    th { color: #616a7c; background: #f8f9fb; font-size: 14px; }
    tbody tr:hover { background: #fbfcff; }
    td .inline-select { width: auto; min-width: 105px; min-height: 39px; padding: 6px 9px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .activity-card, .word-card, .dictionary-card { padding: 21px; }
    .activity-card h3, .word-card h3, .dictionary-card h2 { margin: 7px 0 10px; font-size: 22px; line-height: 1.35; }
    .meta-list { display: grid; gap: 9px; margin: 16px 0; }
    .meta-list div { padding: 10px 12px; border-radius: 10px; background: #f7f8fa; }
    .meta-list b { display: block; color: var(--muted); font-size: 13px; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 1px dashed #cfd4df; border-radius: var(--radius); background: rgba(255,255,255,.7); }
    .student-shell { width: min(680px, calc(100% - 28px)); margin: 0 auto; padding: 24px 0 54px; font-size: 18px; }
    .student-hero { padding: 25px; margin-bottom: 16px; }
    .student-hero h1 { margin: 5px 0 10px; font-size: clamp(27px, 8vw, 34px); line-height: 1.25; letter-spacing: -.04em; }
    .student-hero p { margin: 0; color: var(--muted); }
    .student-card { padding: 22px; margin-bottom: 14px; }
    .student-card h2 { margin: 0 0 10px; font-size: 23px; line-height: 1.35; }
    .choice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .word-submit-row { display: grid; grid-template-columns: 140px minmax(0,1fr) auto; gap: 9px; align-items: stretch; }
    .word-submit-row select { min-width: 0; }
    .choice-btn { min-height: 56px; border: 2px solid #d7dbe3; border-radius: 13px; background: white; font-weight: 850; }
    .choice-btn.active { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
    .star-row { display: flex; align-items: center; gap: 1px; margin: 9px 0 3px; }
    .star { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: #c5cad3; font-size: 37px; line-height: 1; }
    .star.on { color: #f2aa1b; }
    .star:focus-visible { outline: 3px solid rgba(49,87,213,.35); border-radius: 9px; }
    .rating-copy { color: var(--muted); font-size: 14px; }
    .mine-label { display: inline-flex; color: var(--primary); background: var(--primary-soft); border-radius: 99px; padding: 3px 9px; font-size: 12px; font-weight: 850; }
    .prompt { padding: 15px; margin: 14px 0; border-left: 4px solid var(--primary); border-radius: 4px 12px 12px 4px; background: var(--primary-soft); font-weight: 750; }
    .modal-layer { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(20, 25, 36, .58); backdrop-filter: blur(4px); }
    .modal-layer.qr-layer { background: rgba(20,25,36,.2); backdrop-filter: blur(1px); }
    .modal { width: min(680px, 100%); max-height: calc(100vh - 40px); overflow: auto; border-radius: 20px; background: white; box-shadow: 0 25px 80px rgba(0,0,0,.25); }
    .modal.wide { width: min(1040px, 100%); }
    .modal.qr-modal { width: min(780px, calc(100vw - 40px)); }
    .modal.qr-modal .modal-head { cursor: grab; user-select: none; }
    .modal.qr-modal .modal-head:active { cursor: grabbing; }
    .modal.is-draggable { position: fixed; margin: 0; }
    .modal-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; gap: 15px; align-items: center; padding: 20px 22px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); }
    .modal-head h2 { margin: 0; font-size: 23px; }
    .icon-btn { display: grid; place-items: center; width: 42px; height: 42px; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: white; font-size: 23px; }
    .modal-body { padding: 22px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 9px; padding: 16px 22px 22px; }
    .qr-box { display: grid; place-items: center; width: min(500px, 100%); min-height: 500px; margin: 0 auto 18px; padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: white; }
    .qr-box img, .qr-box canvas { max-width: 100%; height: auto !important; }
    .url-box { padding: 12px; border-radius: 10px; background: #f2f4f8; color: #4f5868; font-size: 13px; word-break: break-all; }
    .drag-hint { margin: 0 0 13px; color: var(--muted); font-size: 12px; text-align: center; }
    .qr-full .modal { width: min(94vw, 920px); }
    .qr-full .qr-box { width: min(68vh, 720px); min-height: min(68vh, 720px); }
    .confirm-copy { font-size: 18px; }
    .toast-region { position: fixed; z-index: 90; right: 18px; bottom: 18px; display: grid; gap: 9px; width: min(360px, calc(100% - 36px)); }
    .toast { padding: 14px 17px; border-radius: 12px; color: white; background: #303847; box-shadow: var(--shadow); animation: toast-in .2s ease-out; }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    @keyframes toast-in { from { transform: translateY(9px); opacity: 0; } }
    .loading-layer { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(245,246,249,.76); backdrop-filter: blur(2px); }
    .loading-card { display: flex; gap: 13px; align-items: center; padding: 17px 21px; border-radius: 14px; background: white; box-shadow: var(--shadow); font-weight: 800; }
    .spinner { width: 24px; height: 24px; border: 3px solid #dce3fa; border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .login { width: min(480px, calc(100% - 30px)); margin: 10vh auto; padding: 30px; }
    .login h1 { margin: 0 0 8px; font-size: 30px; }
    .login p { color: var(--muted); }
    .home-shell { width: min(1180px, calc(100% - 48px)); max-width: 100%; min-width: 0; margin: 0 auto; padding: 28px 0 34px; }
    .home-topbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 54px; }
    .home-identity { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; font-weight: 900; letter-spacing: -.035em; }
    .metaphor-mark { position: relative; display: block; width: 38px; height: 38px; border-radius: 50%; background: #183f4a; box-shadow: inset 0 0 0 9px #dfe9e3; }
    .metaphor-mark::before, .metaphor-mark::after { content: ""; position: absolute; border-radius: 50%; background: #e76c50; }
    .metaphor-mark::before { width: 7px; height: 7px; right: 1px; top: 2px; }
    .metaphor-mark::after { width: 4px; height: 4px; right: -7px; top: 0; background: #eebc6b; }
    .home-meta { color: #7b817d; font-size: 12px; font-weight: 800; letter-spacing: .14em; }
    .home-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(390px, .82fr); gap: clamp(46px, 7vw, 88px); align-items: center; min-height: 550px; padding: 54px 0 66px; }
    .home-copy { min-width: 0; }
    .home-copy .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: #66726d; font-size: 12px; letter-spacing: .13em; }
    .home-copy .eyebrow::before { content: ""; width: 22px; height: 1px; background: #e76c50; }
    .home-hero h1 { max-width: 670px; margin: 20px 0 24px; color: #16282d; font-size: clamp(48px, 6.2vw, 76px); font-weight: 820; line-height: 1.08; letter-spacing: -.065em; }
    .home-hero h1 em { color: #d9583f; font-family: Georgia, "Noto Serif KR", serif; font-weight: 500; }
    .home-hero .home-lead { max-width: 580px; margin: 0; color: #586763; font-size: clamp(17px, 1.8vw, 20px); line-height: 1.8; }
    .home-principles { display: flex; gap: 24px; margin-top: 32px; color: #243b40; font-size: 13px; font-weight: 800; }
    .home-principles span { display: inline-flex; align-items: center; gap: 8px; }
    .home-principles i { width: 6px; height: 6px; border-radius: 50%; background: #e76c50; box-shadow: 0 0 0 5px rgba(231,108,80,.1); }
    .home-visual { position: relative; width: 100%; max-width: 500px; justify-self: end; aspect-ratio: 1 / .92; overflow: hidden; border-radius: 34px; background: #17383e; box-shadow: 0 30px 75px rgba(23,56,62,.18); isolation: isolate; }
    .home-visual::before { content: ""; position: absolute; width: 330px; height: 330px; right: -100px; top: -110px; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; box-shadow: 0 0 0 55px rgba(255,255,255,.018), 0 0 0 110px rgba(255,255,255,.012); }
    .home-visual::after { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .35; background-image: radial-gradient(rgba(255,255,255,.24) .7px, transparent .7px); background-size: 17px 17px; -webkit-mask-image: linear-gradient(to bottom right, black, transparent 72%); mask-image: linear-gradient(to bottom right, black, transparent 72%); }
    .flow-art { position: absolute; inset: 0; width: 100%; height: 100%; }
    .flow-line { fill: none; stroke: rgba(222,236,228,.62); stroke-width: 1.4; }
    .flow-line.secondary { stroke: rgba(222,236,228,.18); stroke-width: 1; }
    .flow-orbit { fill: none; stroke: rgba(238,188,107,.55); stroke-width: 1; stroke-dasharray: 4 7; }
    .flow-seed { fill: #e76c50; }
    .flow-seed.glow { filter: drop-shadow(0 0 16px rgba(231,108,80,.85)); }
    .flow-stone { fill: #f1c27a; }
    .visual-index { position: absolute; left: 28px; top: 27px; color: rgba(235,242,237,.62); font-size: 10px; font-weight: 800; letter-spacing: .18em; writing-mode: vertical-rl; }
    .visual-caption { position: absolute; left: 30px; right: 30px; bottom: 27px; display: flex; justify-content: space-between; align-items: end; gap: 20px; color: #f1f4ef; }
    .visual-caption strong { display: block; max-width: 255px; font-size: 20px; line-height: 1.45; letter-spacing: -.025em; }
    .visual-caption span { color: rgba(241,244,239,.55); font-size: 11px; letter-spacing: .13em; }

    .entry-heading h2 { max-width: 480px; margin: 5px 0 0; font-size: clamp(26px, 3vw, 36px); line-height: 1.25; letter-spacing: -.045em; }

    .stage-btn.active { border-color: var(--accent); background: var(--accent-soft); color: #8f2e25; box-shadow: inset 0 0 0 1px var(--accent); }

    /* 차시형 교사·학생 화면 */

<body>
  <main id="app"></main>
  <div id="modalRoot"></div>
  <div id="loading" class="loading-layer hidden" role="status" aria-live="polite"><div class="loading-card"><span class="spinner"></span><span id="loadingText">불러오는 중...</span></div></div>
  <div id="toasts" class="toast-region" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./supabase-api.js"></script>
  <script>
    'use strict';
    const query = new URLSearchParams(location.search);
    const studentActivityViews = ['submit', 'rate', 'context', 'wordmaking', 'dictionary'];
    const allowedViews = ['home', 'student', 'teacher', 'admin'];
    const requestedView = query.get('view') || 'home';
    const normalizedView = studentActivityViews.includes(requestedView) ? 'student' : requestedView;
    const CONFIG = Object.freeze(Object.assign({}, window.APP_CONFIG || {}, {
      view: allowedViews.includes(normalizedView) ? normalizedView : 'home',
      taskId: String(query.get('taskId') || '').slice(0, 80),
      wordId: String(query.get('wordId') || '').slice(0, 80),
      classCode: String(query.get('code') || '').replace(/[^a-z0-9]/gi, '').toUpperCase().slice(0, 12),
      baseUrl: location.origin + location.pathname
    }));
    const CATEGORIES = ['비속어', '유행어', '외래어'];
    const CLASS_STAGES = [
      { id: 'waiting', label: '수업 대기' },
      { id: 'submit', label: '1차시 · 우리 반 언어 수집하기' },
      { id: 'rate', label: '1차시 · 우리 반 언어 수집하기' },
      { id: 'context', label: '2차시 · 언어 사용 맥락 고려하기' },
      { id: 'wordmaking', label: '3차시 · 우리말 순화하기' },
      { id: 'dictionary', label: '4차시 · 우리 반 우리말 사전 만들기' }
    ];
    const state = {
      anonId: getAnonId(),
      adminToken: sessionStorage.getItem('koreanClassAdminToken') || '',
      teacherToken: sessionStorage.getItem('koreanClassTeacherToken') || '',
      teacherClasses: [],
      activeClass: null,
      classInfo: null,
      stageTimer: null,
      teacherTimer: null,
      tab: 'words',
      dashboard: null,
      wordFilter: '전체', wordSearch: '',
      makingFilter: '전체', makingSearch: '',
      dictionaryFilter: '전체', dictionarySearch: '',
      contextData: null,
      contextLesson: null,
      selectedContextTask: null,
      contextShowRatings: false,
      selectedMakingWord: null,
      makingWords: [],
      wordmakingWorkspace: [],
      publishedDictionary: [],
      classPledges: []
    };

    document.addEventListener('DOMContentLoaded', boot);
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        const layer = document.querySelector('.modal-layer');
        if (layer) layer.classList.remove('qr-full');
      }
    });

    async function boot() {
      try {
        if (CONFIG.view === 'home') return renderHomeView();
        await AppApi.init(CONFIG.view);
        if (CONFIG.view === 'student') return enterStudentPortal(CONFIG.classCode || localStorage.getItem('koreanClassCode') || '');
        if (CONFIG.view === 'teacher') {
          const savedToken = await AppApi.getTeacherToken();
          if (savedToken) {
            state.teacherToken = savedToken;
            sessionStorage.setItem('koreanClassTeacherToken', savedToken);
            return loadTeacherPortal();
          }
          return renderTeacherEntry();
        }
        if (CONFIG.view === 'admin') {
          const savedToken = await AppApi.getAdminToken();
          if (savedToken) {
            state.adminToken = savedToken;
            sessionStorage.setItem('koreanClassAdminToken', savedToken);
          }
          return renderAdminEntry();
        }
        renderError('지원하지 않는 화면입니다.');
      } catch (error) {
        renderError(error && error.message ? error.message : String(error));
      }
    }

    function getAnonId() {
      let id = localStorage.getItem('koreanClassAnonId');
      if (/^anon_[a-z0-9-]{12,80}$/i.test(id || '')) return id;
      const random = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID().replace(/-/g, '')
        : (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2));
      id = 'anon_' + random;
      localStorage.setItem('koreanClassAnonId', id);
      return id;
    }

    function api(name, ...args) {
      return AppApi.call(name, ...args);
    }

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }
    function attr(value) { return esc(value).replace(/`/g, '&#96;'); }
    function jsArg(value) { return esc(JSON.stringify(String(value == null ? '' : value))); }
    function categoryClass(category) { return category === '비속어' ? 'badge-slang' : category === '외래어' ? 'badge-loan' : 'badge-trend'; }
    function badge(category) { return `<span class="badge ${categoryClass(category)}">${esc(category)}</span>`; }
    function formatScore(value) { return Number(value) ? Number(value).toFixed(1) : '-'; }
    function setApp(html) { document.getElementById('app').innerHTML = html; }
    function showLoading(text) { document.getElementById('loadingText').textContent = text || '불러오는 중...'; document.getElementById('loading').classList.remove('hidden'); }
    function hideLoading() { document.getElementById('loading').classList.add('hidden'); }
    function toast(message, type) {
      const item = document.createElement('div');
      item.className = 'toast ' + (type || ''); item.textContent = message;
      document.getElementById('toasts').appendChild(item);
      setTimeout(() => item.remove(), 3300);
    }
    function friendlyError(error) {
      const message = error && error.message ? error.message : '요청을 처리하지 못했습니다.';
      if (/인증이 만료/.test(message)) {
        if (CONFIG.view === 'admin') {
          sessionStorage.removeItem('koreanClassAdminToken'); state.adminToken = '';
          renderAdminEntry();
        } else if (CONFIG.view === 'teacher') {
          sessionStorage.removeItem('koreanClassTeacherToken'); state.teacherToken = '';
          renderTeacherEntry();
        }
      }
      toast(message, 'error');
      return message;
    }
    function setButtonBusy(button, busy, label) {
      if (!button) return;
      if (busy) { button.dataset.originalText = button.textContent; button.disabled = true; button.textContent = label || '저장 중...'; }
      else { button.disabled = false; button.textContent = button.dataset.originalText || button.textContent; }
    }

          <button class="lesson-tab ${state.tab==='lesson4'?'active':''}" data-lesson="lesson4"><b>LESSON 04</b><span>우리 반 사전<br>만들기</span></button>
        </nav><main id="teacherLessonContent"></main></div>`);

    function leaveTeacherClass() {
      if (state.teacherTimer) clearInterval(state.teacherTimer);
      state.activeClass = null; state.dashboard = null; state.tab = 'lesson1'; renderTeacherChoice();
    }

    function startTeacherRefreshWatcher() {
      if (state.teacherTimer) clearInterval(state.teacherTimer);
      state.teacherTimer = setInterval(async () => {
        if (!state.activeClass || document.hidden || document.querySelector('.modal-layer')) return;
        try {
          state.dashboard = await api('getClassDashboard', state.teacherToken, state.activeClass.id);
          renderTeacherLessonTab();
        } catch (_) { /* 다음 주기에 다시 확인합니다. */ }
      }, 5000);
    }

    function teacherLessonHero(number, title, description, stage) {
      const active = stage === 'submit'
        ? ['submit','rate'].includes(state.activeClass.currentStage)
        : state.activeClass.currentStage === stage;
      return `<section class="lesson-hero"><span class="lesson-number">${esc(number)}</span><div class="lesson-copy"><h2>${esc(title)}</h2><p>${esc(description)}</p></div><div class="lesson-actions">${active?'<span class="live-pill">학생 화면에 진행 중</span>':`<button class="btn btn-primary" onclick="startClassStage('${attr(stage)}')">차시 시작</button>`}${state.activeClass.currentStage!=='waiting'?'<button class="btn" onclick="startClassStage(\'waiting\')">학생 화면 닫기</button>':''}</div></section>`;
    }

    function renderTeacherLessonTab() {
      if (state.tab === 'lesson1') return renderTeacherLessonOne();
      if (state.tab === 'lesson2') return renderTeacherLessonTwo();
      if (state.tab === 'lesson3') return renderTeacherLessonThree();
      return renderTeacherLessonFour();
    }

    async function startClassStage(stage, taskId) {
      if (stage === 'context' && !(state.dashboard.contextGroups || []).length) { toast('학생에게 보여 줄 맥락과 표현을 먼저 만들어 주세요.', 'error'); return; }
      if (stage === 'wordmaking' && !(state.dashboard.words || []).some(item => item.approved)) { toast('학생에게 보여 줄 순화 대상을 먼저 선택해 주세요.', 'error'); return; }
      showLoading('학생 화면을 전환하는 중...');
      try {
        state.activeClass = await api('setClassStage', state.teacherToken, state.activeClass.id, stage, taskId || '');
        toast('학생 화면이 전환되었습니다.', 'success'); renderTeacherClassShell();
      } catch (error) { friendlyError(error); }
      finally { hideLoading(); }
    }

    function averageLabel(item) {
      return item.ratingCount ? `<span class="score-pill"><span class="score-star">★</span>${formatScore(item.averageRating)} <small>(${item.ratingCount})</small></span>` : '<span class="score-pill">아직 별점 없음</span>';
    }

      const root = document.getElementById('teacherLessonContent'); if (!root) return;
      const words = state.dashboard.words || [];
      root.innerHTML = `${teacherLessonHero('01','우리 반 언어 수집하기','학생들이 적은 표현과 별점 평균을 한눈에 봅니다.','submit')}
        <div class="lesson-tools"><div><h3>수집된 언어</h3><p><span class="live-pill">5초마다 새로 반영</span></p></div><span class="count">${words.length}개</span></div>
        <section class="simple-panel card"><div class="simple-list">${words.length ? words.map(word => `<div class="simple-row"><div class="simple-word">${esc(word.word)} <span class="badge ${categoryClass(word.category)}">${esc(word.category)}</span><small>${word.submissionCount}명이 제출</small></div>${averageLabel(word)}<div class="row-actions actions"><button class="btn icon-danger" onclick="confirmDeleteWord('${attr(word.id)}',${jsArg(word.word)})">삭제</button></div></div>`).join('') : '<div class="empty">학생이 표현을 입력하면 이곳에 바로 나타납니다.</div>'}</div></section>`;
    }

        <div class="lesson-tools"><div><h3>공통 맥락</h3><p>맥락마다 학생에게 보여 줄 표현을 여러 개 선택할 수 있습니다.</p></div><div class="actions"><span class="count">${groups.length}개</span><button class="btn btn-primary" onclick="openContextGroupEditor()">+ 맥락 추가</button></div></div>
        <section class="context-grid">${groups.length ? groups.map((group,index) => `<article class="context-card card"><p class="eyebrow">맥락 ${String(index+1).padStart(2,'0')}</p><h3>${esc(group.title)}</h3><p class="context-prompt">${esc(group.context)}</p><div class="context-word-list">${group.words.map(word => `<button class="context-word-result" onclick="openContextResults('${attr(word.taskId)}')"><span>${esc(word.word)} ${badge(word.category)}</span><small>답변 ${word.exampleCount} · ★ ${formatScore(word.averageRating)}</small></button>`).join('')}</div><div class="rating-summary"><span class="count">선택 표현 ${group.words.length}개 · 답변 ${group.exampleCount}개</span>${group.ratingCount?`<span class="score-pill"><span class="score-star">★</span>${formatScore(group.averageRating)}</span>`:'<span class="score-pill">별점 없음</span>'}</div><div class="card-actions"><button class="btn" onclick="openContextGroupEditor('${attr(group.id)}')">편집</button><button class="btn icon-danger" onclick="confirmDeleteContextGroup('${attr(group.id)}',${jsArg(group.title)})">삭제</button></div></article>`).join('') : '<div class="empty">‘맥락 추가’를 눌러 첫 맥락을 만들고 표현을 선택해 주세요.</div>'}</section>`;

      root.innerHTML = `${teacherLessonHero('03','우리말 순화하기','1차시에 모은 표현 중 학생에게 보여 줄 대상을 선택합니다.','wordmaking')}<div class="lesson-body"><div class="empty">수집 표현을 불러오는 중...</div></div>`;

    function teacherDictionaryCard(item) {
      const entry = item.entry || {};
      return `<article class="refine-card card"><p class="eyebrow">${entry.approved?'사전 수록 완료':'표제어 선택 대기'} · ${badge(item.category)}</p><h3>${esc(item.word)}${entry.finalWord?` <span style="color:var(--accent)">→ ${esc(entry.finalWord)}</span>`:''}</h3>${entry.meaning?`<p>${esc(entry.meaning)}</p>`:`<p class="help">학생들의 순화말 중 하나를 표제어로 고른 뒤 내용을 다듬어 주세요.</p>`}<div class="dictionary-choice-list">${item.suggestions.length?item.suggestions.map(s => `<button class="dictionary-choice ${entry.finalWord===s.suggestedWord?'selected':''}" onclick="openDictionaryEditor('${attr(item.id)}','${attr(s.id)}')"><strong>${esc(s.suggestedWord)}</strong><span>${s.ratingCount?'★ '+formatScore(s.averageRating)+' · '+s.ratingCount+'명':'별점 없음'}</span></button>`).join(''):'<span class="help">아직 학생이 제출한 순화말이 없습니다. 직접 표제어를 작성할 수도 있습니다.</span>'}</div><button class="btn btn-primary btn-block" onclick="openDictionaryEditor('${attr(item.id)}')">${entry.finalWord?'표제어·사전 내용 수정':'표제어 직접 작성'}</button></article>`;

      return loadAdminDashboard(silent);
    }

    async function logoutTeacherAccount() {
      if (state.teacherTimer) clearInterval(state.teacherTimer);
      try { await AppApi.signOut(); } catch (error) { friendlyError(error); }
      sessionStorage.removeItem('koreanClassTeacherToken'); sessionStorage.removeItem('koreanActiveClassCode');
      state.teacherToken = ''; state.teacherClasses = []; state.activeClass = null; state.dashboard = null;
      location.href = CONFIG.baseUrl;

    function renderAdminEntry() {
      if (state.adminToken) return loadAdminDashboard();
      setApp(`<form id="loginForm" class="login card">
        <p class="eyebrow">관리자 전용</p><h1>우리 반 우리말 사전</h1>
        <p>자료 승인·수정·삭제 권한이 있는 관리자만 로그인할 수 있습니다.</p>
        <label class="field-label" for="adminEmail">관리자 이메일</label>
        <input id="adminEmail" type="email" autocomplete="username" required>
        <label class="field-label" for="adminPassword">관리자 비밀번호</label>
        <input id="adminPassword" type="password" autocomplete="current-password" required>
        <button class="btn btn-primary btn-lg btn-block" type="submit" style="margin-top:16px">관리자 화면 열기</button>
      </form>`);
      document.getElementById('loginForm').addEventListener('submit', async event => {
        event.preventDefault(); const button = event.submitter;
        setButtonBusy(button, true, '확인 중...');
        try {
          const result = await api('verifyAdminCredentials', document.getElementById('adminEmail').value, document.getElementById('adminPassword').value);
          state.adminToken = result.token; sessionStorage.setItem('koreanClassAdminToken', result.token);
          await loadAdminDashboard();
        } catch (error) { friendlyError(error); setButtonBusy(button, false); }
      });
    }

      try {
        state.dashboard = await api('getAdminDashboard', state.adminToken);
        renderAdminShell();
      } catch (error) { friendlyError(error); }
      finally { hideLoading(); }

      try { await AppApi.signOut(); }

    /* ------------------------------ 학생 클래스 ------------------------------ */
    async function enterStudentPortal(classCode) {
      const code = String(classCode || '').replace(/[^a-z0-9]/gi, '').toUpperCase();
      if (!/^[A-Z0-9]{4,12}$/.test(code)) {
        renderError('선생님에게 받은 영문·숫자 4~12자리 클래스 코드를 입력해 주세요.');
        return;
      }
      showLoading('클래스에 입장하는 중...');
      try {
        state.classInfo = await api('joinClass', code);
        localStorage.setItem('koreanClassCode', state.classInfo.classCode);
        renderStudentStage();
        startStudentStageWatcher();
      } catch (error) { renderError(error && error.message ? error.message : String(error)); }
      finally { hideLoading(); }
    }

    function startStudentStageWatcher() {
      if (state.stageTimer) clearInterval(state.stageTimer);
      state.stageTimer = setInterval(async () => {
        if (!state.classInfo || document.hidden) return;
        try {
          const latest = await api('getStudentClassState', state.classInfo.id);
          const changed = latest.currentStage !== state.classInfo.currentStage || latest.currentTaskId !== state.classInfo.currentTaskId;
          state.classInfo = latest;
          if (changed) { toast('수업 단계가 바뀌었습니다.', 'success'); renderStudentStage(); }
        } catch (_) { /* 다음 확인 주기에 다시 시도합니다. */ }
      }, 5000);
    }

    function renderStudentStage() {
      if (!state.classInfo) return;
      state.selectedMakingWord = null;
      const stage = state.classInfo.currentStage;
      if (stage === 'submit' || stage === 'rate') return renderSubmitView();
      if (stage === 'context') return renderContextView();
      if (stage === 'wordmaking') return renderWordmakingView();
      if (stage === 'dictionary') return renderDictionaryView();
      setApp(studentHeader('수업을 준비하고 있어요', '선생님이 차시를 시작하면 이 화면이 자동으로 바뀝니다.'));
      document.getElementById('studentContent').innerHTML = `<section class="waiting-panel card"><div class="waiting-glyph">✦</div><h2>조금만 기다려 주세요</h2><p class="help">우리 반 네 차시 활동이 곧 시작됩니다.</p></section>`;
    }

    function leaveStudentClass() {
      if (state.stageTimer) clearInterval(state.stageTimer);
      localStorage.removeItem('koreanClassCode');
      state.classInfo = null;
      location.href = CONFIG.baseUrl;
    }

      setApp(studentHeader('1차시 · 우리 반 언어 수집하기', '우리 반에서 자주 쓰거나 자주 듣는 표현을 모으고 함께 별점을 매겨 보세요.'));

      </form><div class="lesson-tools"><div><h3>우리 반이 모은 언어</h3><p>별을 눌러 1~5점으로 평가해요.</p></div></div><div id="lessonOneStudentList"><div class="empty">목록을 불러오는 중...</div></div>`;

      const mine = item.mine ? `<span class="mine-label">${kind==='word'?'내가 제출한 표현':'내 예문'}</span>` : '';
      const disabled = kind === 'example' && item.mine;
      return `<article class="student-card card"><div class="rating-summary"><div>${kind==='word'?badge(item.category):''}<h2>${esc(kind==='word'?item.word:item.sentence)} ${kind==='word'?mine:''}</h2></div><span class="score-pill"><span class="score-star">★</span>평균 ${formatScore(item.averageRating)} <small>(${item.ratingCount||0})</small></span></div>${kind==='example'?`<p class="intent-copy"><b>친구의 작성 의도</b>${esc(item.intent)}</p><p class="help">맥락과 의도가 예문에 잘 드러났는지 평가해 보세요.</p>`:''}
        <div class="star-row" role="group" aria-label="별점">${[1,2,3,4,5].map(score => `<button type="button" class="star ${score<=item.myRating?'on':''}" ${disabled?'disabled':''} aria-label="${score}점" onclick="saveRating('${kind}','${attr(item.id)}',${score},this)">★</button>`).join('')}</div>
        <div class="rating-copy" id="score-${attr(item.id)}">${item.myRating ? '내 별점 '+item.myRating+'점' : disabled ? '내 예문은 평가할 수 없습니다.' : '별을 눌러 평가해 주세요.'}</div></article>`;
    }
    async function saveRating(kind, id, score, button) {
      const card = button.closest('.student-card'); const stars = [...card.querySelectorAll('.star')]; stars.forEach(item => item.disabled = true);
      try {
        await api(kind === 'word' ? 'saveWordRating' : 'saveExampleRating', state.anonId, id, score);
        stars.forEach((star,index) => star.classList.toggle('on', index < score)); document.getElementById('score-'+id).textContent = '내 별점 ' + score + '점'; toast('별점을 저장했습니다.', 'success');
        if (kind === 'word') await loadLessonOneStudentWords();
        else await refreshContextLesson(true);
      } catch (error) { friendlyError(error); }
      finally { stars.forEach(item => item.disabled = false); }
    }

    /* ------------------------------ 상황 활동 학생 ------------------------------ */
    async function renderContextView() {
      setApp(studentHeader('2차시 · 언어 사용 맥락 고려하기', '표현과 맥락을 하나씩 골라 예문을 만들고, 그렇게 쓴 의도까지 설명해 보세요.'));
      document.getElementById('studentContent').innerHTML = `<div class="empty">활동을 불러오는 중...</div>`;
      state.selectedContextTask = null; state.contextShowRatings = false;
      try { state.contextLesson = await api('getContextLesson', state.anonId, state.classInfo.id); renderContextLessonList(); }
      catch (error) { document.getElementById('studentContent').innerHTML = `<div class="empty">${esc(friendlyError(error))}</div>`; }
    }
    function renderContextLessonList() {
      const groups = (state.contextLesson && state.contextLesson.groups) || [];
      document.getElementById('studentContent').innerHTML = `<div class="lesson-tools"><div><h3>맥락과 표현 고르기</h3><p>목록을 하나씩 눌러 예문과 작성 의도를 완성해요.</p></div><button class="btn" onclick="renderContextView()">↻ 목록 새로고침</button></div><section class="context-student-groups">${groups.length?groups.map((group,index)=>`<article class="student-card context-student-group card"><p class="eyebrow">맥락 ${String(index+1).padStart(2,'0')}</p><h2>${esc(group.title)}</h2><p class="context-prompt">${esc(group.context)}</p><div class="context-student-words">${group.words.map(word=>`<button class="context-student-word ${word.submitted?'done':''}" onclick="selectContextTask('${attr(word.taskId)}')"><span>${esc(word.word)} ${badge(word.category)}</span><small>${word.submitted?'✓ 답변 완료':'답변하기'} · ${word.exampleCount}명 참여</small></button>`).join('')}</div></article>`).join(''):'<div class="empty">선생님이 맥락과 표현 목록을 준비하고 있습니다.</div>'}</section>`;
    }
    function findContextTask(taskId) {
      for (const group of ((state.contextLesson && state.contextLesson.groups) || [])) {
        const word = group.words.find(item => item.taskId === taskId);
        if (word) return Object.assign({}, word, { groupId: group.id, contextTitle: group.title, context: group.context });
      }
      return null;
    }
    function selectContextTask(taskId) { state.selectedContextTask=findContextTask(taskId);state.contextShowRatings=false;renderStudentContext(false);window.scrollTo({top:0,behavior:'smooth'}); }
    function renderStudentContext(showRatings) {
      const task = state.selectedContextTask;
      if (!task) { renderContextLessonList(); return; }
      if (showRatings) {
        const others = task.examples.filter(item => !item.mine);
        document.getElementById('studentContent').innerHTML = `<button class="btn btn-block" onclick="renderStudentContext(false)" style="margin-bottom:12px">← 내 답변으로 돌아가기</button><div class="student-card card"><p class="eyebrow">${esc(task.contextTitle)}</p>${badge(task.category)}<h2>${esc(task.word)} · 친구들의 예문</h2><p class="context-prompt">${esc(task.context)}</p></div>${others.length ? others.map(item => ratingCard(item,'example')).join('') : '<div class="empty">평가할 다른 친구의 예문이 아직 없습니다.</div>'}`;
        return;
      }
      const mine = task.ownResponse;
      document.getElementById('studentContent').innerHTML = `<button class="btn btn-block" onclick="state.selectedContextTask=null;renderContextLessonList()" style="margin-bottom:12px">← 전체 목록</button><article class="student-card card"><p class="eyebrow">${esc(task.contextTitle)} · 함께 살펴볼 표현</p>${badge(task.category)}<h2>${esc(task.word)}</h2><p class="context-prompt">${esc(task.context)}</p></article>
        <form id="exampleForm" class="student-card card"><label class="field-label" for="sentence">이 맥락에서 사용할 예문</label><textarea id="sentence" required maxlength="800" placeholder="예문을 직접 만들어 보세요.">${esc(mine?mine.sentence:'')}</textarea>
        <label class="field-label" for="exampleIntent">이 문장을 만든 의도</label><textarea id="exampleIntent" required maxlength="600" placeholder="왜 이 표현과 문장을 골랐는지, 어떤 느낌이나 뜻을 전하려 했는지 적어 보세요.">${esc(mine?mine.intent:'')}</textarea><button class="btn btn-primary btn-lg btn-block" type="submit">${mine?'예문과 의도 수정':'예문과 의도 제출'}</button></form>
        ${mine?'<button class="btn btn-soft btn-lg btn-block" onclick="refreshContextLesson(true)">다른 친구들이 만든 예문 평가하기</button>':''}`;
      document.getElementById('exampleForm').addEventListener('submit', async event => {
        event.preventDefault(); const button = event.submitter; setButtonBusy(button,true,'저장 중...');
        try { await api('submitContextExample',state.anonId,task.taskId,document.getElementById('sentence').value,document.getElementById('exampleIntent').value); toast('예문과 작성 의도를 저장했습니다.','success'); await refreshContextLesson(false); }
        catch(error){friendlyError(error);setButtonBusy(button,false);}
      });
    }
    async function refreshContextLesson(showRatings){const taskId=state.selectedContextTask&&state.selectedContextTask.taskId;showLoading('활동을 새로 불러오는 중...');try{state.contextLesson=await api('getContextLesson',state.anonId,state.classInfo.id);state.selectedContextTask=taskId?findContextTask(taskId):null;state.contextShowRatings=Boolean(showRatings);if(state.selectedContextTask)renderStudentContext(state.contextShowRatings);else renderContextLessonList();}catch(error){friendlyError(error);}finally{hideLoading();}}

    /* ------------------------------ 우리말 만들기 학생 ------------------------------ */
    async function renderWordmakingView() {
      setApp(studentHeader('3차시 · 우리말 순화하기', '알맞은 우리말과 바꾼 이유를 제안하고, 친구들의 생각에 별점을 매겨 보세요.'));
      document.getElementById('studentContent').innerHTML='<div class="empty">표현 목록을 불러오는 중...</div>';
      try { state.makingWords=await api('getWordmakingWords',state.anonId,state.classInfo.id); if(CONFIG.wordId) state.selectedMakingWord=state.makingWords.find(item=>item.id===CONFIG.wordId)||null; renderMakingContent(); }
      catch(error){document.getElementById('studentContent').innerHTML=`<div class="empty">${esc(friendlyError(error))}</div>`;}
    }
    function renderMakingContent(){
      const root=document.getElementById('studentContent');
      if(state.selectedMakingWord){ const word=state.selectedMakingWord; const own=word.ownSuggestion||{}; root.innerHTML=`<button class="btn btn-block" onclick="state.selectedMakingWord=null;renderMakingContent()" style="margin-bottom:12px">← 다른 표현 고르기</button><article class="student-card card"><p class="eyebrow">원래 표현</p>${badge(word.category)}<h2>${esc(word.word)}</h2></article>
        <form id="suggestionForm" class="student-card card"><label class="field-label" for="suggestedWord">내가 생각한 순화말</label><input id="suggestedWord" type="text" maxlength="120" required placeholder="더 알맞은 우리말을 적어 보세요" value="${attr(own.suggestedWord||'')}">
        <label class="field-label" for="suggestionReason">이렇게 바꾼 이유</label><textarea id="suggestionReason" maxlength="600" required placeholder="말의 느낌과 뜻을 생각해 설명해 보세요">${esc(own.reason||'')}</textarea>
        <button class="btn btn-primary btn-lg btn-block" type="submit" style="margin-top:18px">${word.submitted?'우리말 제안 수정':'우리말 제안 제출'}</button></form>
        <div class="lesson-tools"><div><h3>우리 반의 순화말</h3><p>친구들의 순화말과 이유를 읽고 1~5점으로 평가해요.</p></div><span class="count">${word.suggestionCount||0}개</span></div>
        <div class="suggestion-rating-list">${word.suggestions&&word.suggestions.length?word.suggestions.map(suggestionRatingCard).join(''):'<div class="empty">첫 번째 순화말을 제안해 주세요.</div>'}</div>`;
        document.getElementById('suggestionForm').addEventListener('submit',submitSuggestion); return;
      }
      root.innerHTML=`<div class="lesson-tools"><div><h3>순화할 표현</h3><p>하나씩 골라 나만의 순화말을 제안해요.</p></div><button class="btn" onclick="renderWordmakingView()">↻ 목록 새로고침</button></div><div id="makingList"></div>`;
      renderMakingList();
    }
    function renderMakingList(){ const root=document.getElementById('makingList'); if(!root)return;root.innerHTML=state.makingWords.length?state.makingWords.map(item=>`<article class="student-card card"><div class="rating-summary"><span>${badge(item.category)} ${item.submitted?'<span class="mine-label">제안 완료</span>':''}</span><span class="count">순화말 ${item.suggestionCount||0}개</span></div><h2>${esc(item.word)}</h2><button class="btn btn-primary btn-block" onclick="selectMakingWord('${attr(item.id)}')">${item.submitted?'제안·별점 보기':'이 표현 순화하기'}</button></article>`).join(''):'<div class="empty">선생님이 순화할 표현을 고르는 중입니다.</div>'; }
    function selectMakingWord(id){state.selectedMakingWord=state.makingWords.find(item=>item.id===id);renderMakingContent();window.scrollTo({top:0,behavior:'smooth'});}
    function suggestionRatingCard(item){const disabled=item.mine;return `<article class="suggestion-rating-card student-card card"><div class="rating-summary"><div><span class="eyebrow">${item.mine?'내 순화말':'친구의 순화말'}</span><h2>${esc(item.suggestedWord)}</h2></div><span class="score-pill"><span class="score-star">★</span>평균 ${formatScore(item.averageRating)} <small>(${item.ratingCount||0})</small></span></div><p class="intent-copy"><b>순화한 이유</b>${esc(item.reason)}</p><div class="star-row" role="group" aria-label="순화말 별점">${[1,2,3,4,5].map(score=>`<button type="button" class="star ${score<=item.myRating?'on':''}" ${disabled?'disabled':''} aria-label="${score}점" onclick="saveSuggestionScore('${attr(item.id)}',${score},this)">★</button>`).join('')}</div><div class="rating-copy">${item.myRating?'내 별점 '+item.myRating+'점':disabled?'내 순화말은 평가할 수 없습니다.':'별을 눌러 평가해 주세요.'}</div></article>`;}
    async function submitSuggestion(event){event.preventDefault();const button=event.submitter;const wordId=state.selectedMakingWord.id;setButtonBusy(button,true,'저장 중...');const payload={wordId,suggestionType:'새로운 말 만들기',suggestedWord:document.getElementById('suggestedWord').value,reason:document.getElementById('suggestionReason').value};try{await api('submitWordSuggestion',state.anonId,payload);toast('순화말을 저장했습니다.','success');state.makingWords=await api('getWordmakingWords',state.anonId,state.classInfo.id);state.selectedMakingWord=state.makingWords.find(item=>item.id===wordId)||null;renderMakingContent();}catch(error){friendlyError(error);setButtonBusy(button,false);}}
    async function saveSuggestionScore(id,score,button){const card=button.closest('.suggestion-rating-card');const stars=[...card.querySelectorAll('.star')];stars.forEach(item=>item.disabled=true);const wordId=state.selectedMakingWord.id;try{await api('saveSuggestionRating',state.anonId,id,score);toast('순화말 별점을 저장했습니다.','success');state.makingWords=await api('getWordmakingWords',state.anonId,state.classInfo.id);state.selectedMakingWord=state.makingWords.find(item=>item.id===wordId)||null;renderMakingContent();}catch(error){friendlyError(error);stars.forEach(item=>item.disabled=false);}}

    /* ------------------------------ 공개 사전 ------------------------------ */
    async function renderDictionaryView(){
      setApp(studentHeader('4차시 · 우리 반 우리말 사전','완성된 사전을 함께 읽고, 바른 언어생활을 위한 나의 다짐을 남겨 보세요.'));
      document.getElementById('studentContent').innerHTML=`<section class="dictionary-cover card"><p class="eyebrow" style="color:#d9eee6">함께 고르고, 함께 가꾼 말</p><h1>우리 반 우리말 사전</h1><button class="btn no-print" onclick="window.print()" style="margin-top:18px">인쇄 · PDF 저장</button></section><div id="dictionaryList" class="dictionary-list" style="margin-top:16px"><div class="empty">사전을 불러오는 중...</div></div>
        <div class="lesson-tools pledge-heading"><div><h3>언어 순화를 위한 나의 다짐</h3><p>한 사람당 하나의 다짐을 익명 댓글로 남길 수 있어요.</p></div></div>
        <form id="pledgeForm" class="student-card pledge-form card no-print"><label class="field-label" for="pledgeText">나의 다짐</label><textarea id="pledgeText" required maxlength="500" placeholder="예: 상대의 마음을 생각하며 쉽고 다정한 우리말을 사용하겠습니다."></textarea><button id="savePledgeBtn" class="btn btn-primary btn-lg btn-block" type="submit">다짐 남기기</button></form>
        <div id="pledgeList" class="pledge-list"><div class="empty">우리 반의 다짐을 불러오는 중...</div></div>`;
      document.getElementById('pledgeForm').addEventListener('submit',submitClassPledge);
      try{[state.publishedDictionary,state.classPledges]=await Promise.all([api('getPublishedDictionary',state.anonId,state.classInfo.id),api('getClassPledges',state.anonId,state.classInfo.id)]);renderDictionaryList();renderPledgeList();setTimeout(()=>{if(new URLSearchParams(location.search).get('print')==='1')window.print();},500);}catch(error){document.getElementById('dictionaryList').innerHTML=`<div class="empty">${esc(friendlyError(error))}</div>`;document.getElementById('pledgeList').innerHTML='';}
    }
    function renderDictionaryList(){const root=document.getElementById('dictionaryList');const list=state.publishedDictionary||[];root.innerHTML=list.length?list.map((item,index)=>`<article class="dictionary-card card"><p class="eyebrow">${String(index+1).padStart(2,'0')} · ${esc(item.originalWord)}</p>${badge(item.category)}<h2>${esc(item.finalWord)}</h2><div class="definition"><div><b>뜻과 순화한 이유</b>${esc(item.meaning)}</div>${item.exampleSentence?`<div><b>사용 예문</b>${esc(item.exampleSentence)}</div>`:''}</div></article>`).join(''):'<div class="empty">선생님이 사전 원고를 완성하는 중입니다.</div>';}
    function renderPledgeList(){const root=document.getElementById('pledgeList');if(!root)return;const list=state.classPledges||[];const mine=list.find(item=>item.mine);const field=document.getElementById('pledgeText');if(field)field.value=mine?mine.pledge:'';const button=document.getElementById('savePledgeBtn');if(button)button.textContent=mine?'내 다짐 수정':'다짐 남기기';root.innerHTML=list.length?list.map((item,index)=>`<article class="pledge-comment card"><span class="pledge-avatar">${String(index+1).padStart(2,'0')}</span><div><p class="eyebrow">익명 ${String(index+1).padStart(2,'0')} ${item.mine?'<span class="mine-label">나</span>':''}</p><p>${esc(item.pledge)}</p></div></article>`).join(''):'<div class="empty">첫 번째 다짐을 남겨 주세요.</div>';}
    async function submitClassPledge(event){event.preventDefault();const button=event.submitter;setButtonBusy(button,true,'저장 중...');try{await api('saveClassPledge',state.anonId,state.classInfo.id,document.getElementById('pledgeText').value);toast('나의 다짐을 남겼습니다.','success');state.classPledges=await api('getClassPledges',state.anonId,state.classInfo.id);setButtonBusy(button,false);renderPledgeList();}catch(error){friendlyError(error);setButtonBusy(button,false);}}

    /* ------------------------------ 공통 모달 / QR ------------------------------ */
    function openModal(title, body, footer, wide) {
      document.getElementById('modalRoot').innerHTML=`<div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><section class="modal ${wide?'wide':''}"><header class="modal-head"><h2 id="modalTitle">${esc(title)}</h2><button class="icon-btn" onclick="closeModal()" aria-label="닫기">×</button></header><div class="modal-body">${body}</div>${footer?`<footer class="modal-foot">${footer}</footer>`:''}</section></div>`;
      document.addEventListener('keydown',escapeModal); document.querySelector('.modal-layer').addEventListener('click',event=>{if(event.target.classList.contains('modal-layer'))closeModal();});
    }
    function closeModal(){const full=document.fullscreenElement;if(full&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});document.getElementById('modalRoot').innerHTML='';document.removeEventListener('keydown',escapeModal);}
    function escapeModal(event){if(event.key==='Escape'&&!document.fullscreenElement)closeModal();}
    function confirmModal(title,message,onConfirm,confirmLabel){openModal(title,`<p class="confirm-copy">${esc(message)}</p>`,`<button class="btn" onclick="closeModal()">취소</button><button id="confirmAction" class="btn btn-danger">${esc(confirmLabel||'확인')}</button>`);document.getElementById('confirmAction').addEventListener('click',onConfirm);}
    function openQr(url,title){
      openModal(title,`<p class="drag-hint">PC에서는 창 위쪽을 잡고 빈 공간으로 옮길 수 있습니다.</p><div id="qrBox" class="qr-box"><span class="help">QR 코드를 만드는 중...</span></div><div class="url-box">${esc(url)}</div>`,`<button class="btn" onclick="closeModal()">닫기</button><button class="btn" onclick="copyUrl('${attr(url)}')">주소 복사</button><button class="btn btn-primary" onclick="toggleQrFull()">전체 화면</button>`,true);
      const layer=document.querySelector('.modal-layer');const modal=document.querySelector('.modal');if(layer)layer.classList.add('qr-layer');if(modal){modal.classList.add('qr-modal');enableQrDrag(modal);}
      setTimeout(()=>{const box=document.getElementById('qrBox');box.innerHTML='';if(window.QRCode){new QRCode(box,{text:url,width:460,height:460,colorDark:'#17383e',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}else{box.innerHTML='<p>QR 라이브러리를 불러오지 못했습니다.<br>아래 주소를 학생에게 공유해 주세요.</p>';}},0);
    }
    function enableQrDrag(modal){if(innerWidth<800||!matchMedia('(pointer:fine)').matches)return;const head=modal.querySelector('.modal-head');if(!head)return;const rect=modal.getBoundingClientRect();modal.classList.add('is-draggable');modal.style.left=rect.left+'px';modal.style.top=rect.top+'px';modal.style.width=rect.width+'px';let drag=null;head.addEventListener('pointerdown',event=>{if(event.button!==0||event.target.closest('button'))return;const current=modal.getBoundingClientRect();drag={x:event.clientX-current.left,y:event.clientY-current.top};head.setPointerCapture(event.pointerId);});head.addEventListener('pointermove',event=>{if(!drag)return;const maxLeft=Math.max(8,innerWidth-modal.offsetWidth-8);const maxTop=Math.max(8,innerHeight-70);modal.style.left=Math.min(maxLeft,Math.max(8,event.clientX-drag.x))+'px';modal.style.top=Math.min(maxTop,Math.max(8,event.clientY-drag.y))+'px';});const stop=()=>{drag=null;};head.addEventListener('pointerup',stop);head.addEventListener('pointercancel',stop);}
    async function copyUrl(url,label){const subject=label||'주소를';try{await navigator.clipboard.writeText(url);toast(subject+' 복사했습니다.','success');}catch(error){const area=document.createElement('textarea');area.value=url;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();toast(subject+' 복사했습니다.','success');}}
    function toggleQrFull(){const layer=document.querySelector('.modal-layer');const modal=layer&&layer.querySelector('.modal');if(document.fullscreenElement){if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});layer.classList.remove('qr-full');return;}if(!layer||!modal)return;modal.classList.remove('is-draggable');modal.style.left='';modal.style.top='';modal.style.width='';layer.classList.add('qr-full');if(layer.requestFullscreen)layer.requestFullscreen().catch(()=>{});}
  </script>
</body>
