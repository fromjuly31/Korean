    function openRedesignReview(){const next=getReviewableRedesigns()[0];if(!next)return toast('현재 평가할 다른 제안이 없습니다.','error');state.redesignReviewId=next.id;state.redesignReviewScores={};renderMakingContent();window.scrollTo({top:0,behavior:'smooth'});}
    function renderRedesignReview(){const candidate=state.makingWords.flatMap(word=>(word.suggestions||[]).map(item=>Object.assign({word:word.word},item))).find(item=>item.id===state.redesignReviewId);if(!candidate){state.redesignReviewId='';return renderMakingContent();}const metrics=[['meaningScore','의미 보존성','원래 표현의 의미가 잘 살아 있는가?'],['naturalScore','자연스러움','실제로 말할 때 자연스러운가?'],['universalScore','보편성','다양한 사람과 상황에서 두루 사용할 수 있는가?'],['clarityScore','명확성','뜻과 쓰임을 바로 이해할 수 있는가?']];document.getElementById('studentContent').innerHTML=`<button class="btn btn-block" onclick="state.redesignReviewId='';renderMakingContent()" style="margin-bottom:12px">← 설계안 등록으로 돌아가기</button><article class="student-card card"><p class="eyebrow">블라인드 동료 검토</p><h2>${esc(candidate.word)} → <span style="color:var(--accent)">${esc(candidate.suggestedWord)}</span></h2><p class="intent-copy"><b>전달하려는 의미</b>${esc(candidate.meaning)}</p><p class="intent-copy"><b>핵심 특징</b>${esc(candidate.coreFeature)}</p><p class="intent-copy"><b>제안 이유</b>${esc(candidate.reason)}</p>${metrics.map(([key,title,question])=>`<div class="review-metric" data-review-metric="${key}"><h3>${title}</h3><p>${question}</p><div class="score-scale">${[1,2,3,4,5].map(score=>`<button class="score-choice" type="button" onclick="selectReviewScore('${key}',${score},this)">${score}</button>`).join('')}</div></div>`).join('')}<button id="completeReviewBtn" class="btn btn-primary btn-lg btn-block" onclick="submitRedesignReview('${attr(candidate.id)}',this)" disabled>평가 완료</button></article>`;}
    function selectReviewScore(key,score,button){state.redesignReviewScores[key]=score;button.closest('[data-review-metric]').querySelectorAll('.score-choice').forEach(item=>item.classList.toggle('active',item===button));document.getElementById('completeReviewBtn').disabled=Object.keys(state.redesignReviewScores).length<4;}
    async function submitSuggestion(event){event.preventDefault();const button=event.submitter;setButtonBusy(button,true,'저장 중...');const payload={wordId:document.getElementById('redesignWord').value,suggestionType:'새로운 말 만들기',meaning:document.getElementById('redesignMeaning').value,coreFeature:document.getElementById('redesignCoreFeature').value,suggestedWord:document.getElementById('suggestedWord').value,reason:document.getElementById('suggestionReason').value};try{await api('submitWordSuggestion',state.anonId,payload);toast('리디자인 설계안을 등록했습니다.','success');state.makingWords=await api('getWordmakingWords',state.anonId,state.classInfo.id);renderMakingContent();}catch(error){friendlyError(error);setButtonBusy(button,false);}}

    /* ------------------------------ 블라인드 검증 · 공개 사전 ------------------------------ */
    async function renderDictionaryView(){
      setApp(studentHeader('검증: 블라인드 테스트 및 출시','두 표현을 비교해 더 잘 통하는 말을 검증하고, 우리 반 사전을 확인해요.'));

    function getAbOrder(testId){if(typeof state.abOrders[testId]!=='boolean')state.abOrders[testId]=Math.random()<.5;return state.abOrders[testId];}
    function renderVerificationView(){
      const root=document.getElementById('studentContent');const tests=(state.abLesson&&state.abLesson.tests)||[];const pending=tests.find(test=>!test.myResponse);const completed=tests.filter(test=>test.myResponse).length;
      if(pending){const swapped=getAbOrder(pending.id);const left=swapped?pending.redesignedWord:pending.originalWord;const right=swapped?pending.originalWord:pending.redesignedWord;const questions=[['clarity','어느 쪽이 뜻을 더 쉽게 이해할 수 있나요?'],['natural','어느 쪽이 실제 대화에서 더 자연스러운가요?'],['universal','어느 쪽을 더 다양한 사람이 사용할 수 있나요?'],['usage','나라면 어느 쪽을 실제로 사용하겠나요?']];root.innerHTML=`<div class="lesson-tools"><div><h3>${completed+1} / ${tests.length} · 블라인드 비교</h3><p>어느 쪽이 원래 표현인지는 공개하지 않습니다.</p></div><button class="btn" onclick="renderDictionaryView()">↻ 새로고침</button></div><article class="student-card card"><div class="ab-pair"><div class="ab-option"><small>표현 A</small><strong>${esc(left)}</strong></div><span class="ab-vs">VS</span><div class="ab-option"><small>표현 B</small><strong>${esc(right)}</strong></div></div>${questions.map(([key,question])=>`<div class="review-metric" data-ab-question="${key}"><h3>${question}</h3><div class="ab-choices"><button type="button" class="ab-choice" onclick="selectAbChoice('${key}','A',this)">A</button><button type="button" class="ab-choice" onclick="selectAbChoice('${key}','SAME',this)">둘 다 비슷함</button><button type="button" class="ab-choice" onclick="selectAbChoice('${key}','B',this)">B</button></div></div>`).join('')}<button id="submitAbBtn" class="btn btn-primary btn-lg btn-block" onclick="submitAbTest('${attr(pending.id)}',this)" disabled>비교 결과 제출</button></article>`;return;}
      const results=tests.length?`<div class="lesson-tools"><div><h3>검증 결과</h3><p>A는 원래 표현, B는 리디자인 표현 기준으로 환산한 학급 결과입니다.</p></div><button class="btn" onclick="renderDictionaryView()">↻ 새로고침</button></div><section class="launch-grid">${tests.map(test=>`<article class="launch-card card"><div class="rating-summary"><span class="help">${test.responseCount}명 응답</span><span class="improvement-pill">사용성 향상 ${test.improvementScore>0?'+':''}${test.improvementScore}%</span></div><h3>${esc(test.originalWord)} → <span style="color:var(--primary)">${esc(test.redesignedWord)}</span></h3>${abResultHtml(test)}</article>`).join('')}</section>`:'<div class="empty">선생님이 블라인드 검증 항목을 준비하고 있습니다.</div>';
      root.innerHTML=results+`<div class="lesson-tools" style="margin-top:28px"><div><h3>우리 반 우리말 사전</h3><p>교사가 최종 등재한 표현만 검색됩니다.</p></div></div><input id="dictionarySearch" class="dictionary-search" type="search" placeholder="원래 표현 또는 새 표현 검색" value="${attr(state.dictionarySearch||'')}"><div id="dictionaryList" class="dictionary-list"></div>`;const search=document.getElementById('dictionarySearch');if(search)search.addEventListener('input',event=>{state.dictionarySearch=event.target.value;renderDictionaryList();});renderDictionaryList();
    }
    function selectAbChoice(key,choice,button){state.abAnswers[key]=choice;button.closest('[data-ab-question]').querySelectorAll('.ab-choice').forEach(item=>item.classList.toggle('active',item===button));const submit=document.getElementById('submitAbBtn');if(submit)submit.disabled=Object.keys(state.abAnswers).length<4;}
    async function submitAbTest(testId,button){if(Object.keys(state.abAnswers).length<4)return toast('네 가지 비교 항목을 모두 선택해 주세요.','error');const swapped=getAbOrder(testId);const answers={};Object.keys(state.abAnswers).forEach(key=>{const value=state.abAnswers[key];answers[key]=swapped?(value==='A'?'B':value==='B'?'A':value):value;});setButtonBusy(button,true,'제출 중...');try{await api('saveAbResponse',state.anonId,testId,answers);toast('블라인드 비교를 제출했습니다.','success');state.abAnswers={};state.abLesson=await api('getAbTestLesson',state.anonId,state.classInfo.id);renderVerificationView();window.scrollTo({top:0,behavior:'smooth'});}catch(error){friendlyError(error);setButtonBusy(button,false);}}
    function renderDictionaryList(){const root=document.getElementById('dictionaryList');if(!root)return;const query=String(state.dictionarySearch||'').trim().toLowerCase();const data=state.publishedDictionary||{};const list=(data.entries||[]).filter(item=>!query||item.originalWord.toLowerCase().includes(query)||item.finalWord.toLowerCase().includes(query));root.innerHTML=list.length?list.map(item=>`<article class="dictionary-card card"><p class="eyebrow">우리 반 채택 표현</p><h2>${esc(item.originalWord)} → <span style="color:var(--accent)">${esc(item.finalWord)}</span></h2><div class="definition"><div><b>의미</b>${esc(item.meaning)}</div></div>${data.usageTrackingEnabled?`<button class="btn ${item.usedThisWeek?'btn-soft':'btn-primary'} btn-block" ${item.usedThisWeek?'disabled':''} onclick="openDictionaryUsage('${attr(item.id)}',${jsArg(item.finalWord)})">${item.usedThisWeek?'✓ 이번 주 사용 기록 완료':'이번 주에 사용해 봤어요'}</button>`:''}</article>`).join(''):`<div class="empty">${query?'검색 결과가 없습니다.':'교사가 최종 표현을 선정하는 중입니다.'}</div>`;}
    function openDictionaryUsage(dictionaryId,word){openModal('실제 사용 기록',`<form id="dictionaryUsageForm"><p><b>${esc(word)}</b>을(를) 이번 주에 사용했군요.</p><label class="field-label" for="usageContext">어떤 상황에서 사용했나요? <span class="help">(선택)</span></label><textarea id="usageContext" maxlength="400" placeholder="예: 친구와 수행평가 이야기를 할 때"></textarea></form>`,`<button class="btn" onclick="closeModal()">취소</button><button id="saveUsageBtn" class="btn btn-primary" onclick="saveDictionaryUsage('${attr(dictionaryId)}')">기록하기</button>`);}
    async function saveDictionaryUsage(dictionaryId){const button=document.getElementById('saveUsageBtn');setButtonBusy(button,true,'저장 중...');try{await api('saveDictionaryUsage',state.anonId,dictionaryId,document.getElementById('usageContext').value);closeModal();toast('이번 주 실제 사용을 기록했습니다.','success');state.publishedDictionary=await api('getPublishedDictionary',state.anonId,state.classInfo.id);renderDictionaryList();}catch(error){friendlyError(error);setButtonBusy(button,false);}}

    /* ------------------------------ 공통 모달 / QR ------------------------------ */
    function openModal(title, body, footer, wide) {
      const modalClass = wide === 'fullscreen' ? 'fullscreen' : wide ? 'wide' : '';
      document.getElementById('modalRoot').innerHTML=`<div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><section class="modal ${modalClass}"><header class="modal-head"><h2 id="modalTitle">${esc(title)}</h2><button class="icon-btn" onclick="closeModal()" aria-label="닫기">×</button></header><div class="modal-body">${body}</div>${footer?`<footer class="modal-foot">${footer}</footer>`:''}</section></div>`;
      document.addEventListener('keydown',escapeModal); document.querySelector('.modal-layer').addEventListener('click',event=>{if(event.target.classList.contains('modal-layer'))closeModal();});
    }
    function closeModal(){const full=document.fullscreenElement;if(full&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});document.getElementById('modalRoot').innerHTML='';document.removeEventListener('keydown',escapeModal);}
    function escapeModal(event){if(event.key==='Escape'&&!document.fullscreenElement)closeModal();}
    function confirmModal(title,message,onConfirm,confirmLabel){openModal(title,`<p class="confirm-copy">${esc(message)}</p>`,`<button class="btn" onclick="closeModal()">취소</button><button id="confirmAction" class="btn btn-danger">${esc(confirmLabel||'확인')}</button>`);document.getElementById('confirmAction').addEventListener('click',onConfirm);}
    function openQr(url,title){
      openModal(title,`<p class="drag-hint">스캔하면 클래스 코드 입력 없이 이 차시 활동으로 바로 연결됩니다. PC에서는 창 위쪽을 잡아 옮길 수 있습니다.</p><div id="qrBox" class="qr-box"><span class="help">QR 코드를 만드는 중...</span></div><div class="url-box">${esc(url)}</div>`,`<button class="btn" onclick="closeModal()">QR 접기</button><button class="btn" onclick="copyUrl('${attr(url)}')">주소 복사</button><button class="btn btn-primary" onclick="toggleQrFull()">전체 화면</button>`,true);
      const layer=document.querySelector('.modal-layer');const modal=document.querySelector('.modal');if(layer)layer.classList.add('qr-layer');if(modal){modal.classList.add('qr-modal');enableQrDrag(modal);}
      setTimeout(()=>{const box=document.getElementById('qrBox');box.innerHTML='';if(window.QRCode){new QRCode(box,{text:url,width:460,height:460,colorDark:'#17383e',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}else{box.innerHTML='<p>QR 라이브러리를 불러오지 못했습니다.<br>아래 주소를 학생에게 공유해 주세요.</p>';}},0);
    }
    function enableQrDrag(modal){if(innerWidth<800||!matchMedia('(pointer:fine)').matches)return;const head=modal.querySelector('.modal-head');if(!head)return;const rect=modal.getBoundingClientRect();modal.classList.add('is-draggable');modal.style.left=rect.left+'px';modal.style.top=rect.top+'px';modal.style.width=rect.width+'px';let drag=null;head.addEventListener('pointerdown',event=>{if(event.button!==0||event.target.closest('button'))return;const current=modal.getBoundingClientRect();drag={x:event.clientX-current.left,y:event.clientY-current.top};head.setPointerCapture(event.pointerId);});head.addEventListener('pointermove',event=>{if(!drag)return;const maxLeft=Math.max(8,innerWidth-modal.offsetWidth-8);const maxTop=Math.max(8,innerHeight-70);modal.style.left=Math.min(maxLeft,Math.max(8,event.clientX-drag.x))+'px';modal.style.top=Math.min(maxTop,Math.max(8,event.clientY-drag.y))+'px';});const stop=()=>{drag=null;};head.addEventListener('pointerup',stop);head.addEventListener('pointercancel',stop);}
    async function copyUrl(url,label){const subject=label||'주소를';try{await navigator.clipboard.writeText(url);toast(subject+' 복사했습니다.','success');}catch(error){const area=document.createElement('textarea');area.value=url;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();toast(subject+' 복사했습니다.','success');}}
    function toggleQrFull(){const layer=document.querySelector('.modal-layer');const modal=layer&&layer.querySelector('.modal');if(document.fullscreenElement){if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});layer.classList.remove('qr-full');return;}if(!layer||!modal)return;modal.classList.remove('is-draggable');modal.style.left='';modal.style.top='';modal.style.width='';layer.classList.add('qr-full');if(layer.requestFullscreen)layer.requestFullscreen().catch(()=>{});}
  </script>
</body>
