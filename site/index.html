<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="학생들과 함께 만드는 우리 반 우리말 사전">
  <title>우리말 바로쓰기 | 참여형 국어 수업</title>
  <style>
    :root {
      --primary: #315f5b;
      --primary-dark: #244945;
      --primary-soft: #e8f3ef;
      --accent: #ee8065;
      --accent-soft: #fff0ea;
      --ink: #20302f;
      --muted: #71807d;
      --line: #e3e5df;
      --surface: #fffefa;
      --background: #f7f5ef;
      --danger: #b8423f;
      --success: #24715d;
      --warning: #9b671d;
      --shadow: 0 16px 42px rgba(48, 72, 68, .08);
      --radius: 22px;
      --sans: Pretendard, "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      --title-font: "Malgun Gothic", Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--background); }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(246,190,150,.18), transparent 25%),
        radial-gradient(circle at 91% 12%, rgba(163,207,191,.2), transparent 28%),
        radial-gradient(circle at 82% 82%, rgba(202,187,230,.13), transparent 22%),
        var(--background);
      background-attachment: fixed;
      font: 16px/1.65 Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      word-break: keep-all; overflow-wrap: anywhere; overflow-x: hidden;
    }
    body.home-page {
      background:
        radial-gradient(circle at 86% 9%, rgba(178,205,191,.32), transparent 29%),
        radial-gradient(circle at 4% 42%, rgba(238,188,107,.12), transparent 23%),
        #f3f2ec;
    }
    #app { width: 100%; min-width: 0; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .62; }
    .hidden { display: none !important; }
    .sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important; }
    .shell { width: min(1240px, calc(100% - 36px)); margin: 0 auto; padding: 30px 0 60px; }
    .app-header { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
    .header-actions { margin-left: auto; }
    .brand-mark { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 15px; background: var(--primary); color: white; font-size: 25px; font-weight: 900; }
    .app-header h1 { margin: 0; font-size: clamp(25px, 3vw, 32px); line-height: 1.25; letter-spacing: -.03em; }
    .eyebrow { margin: 0 0 2px; color: var(--primary); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
    .admin-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 22px; padding: 7px; background: #e9ebf1; border-radius: 17px; }
    .admin-nav.admin-nav-four { grid-template-columns: repeat(4, 1fr); }
    .nav-btn { min-height: 52px; border: 0; border-radius: 12px; color: #50596b; background: transparent; font-weight: 800; font-size: 16px; }
    .nav-btn.active { color: var(--primary); background: white; box-shadow: 0 3px 12px rgba(40, 50, 80, .08); }
    .card { background: var(--surface); border: 1px solid rgba(215, 220, 230, .9); border-radius: var(--radius); box-shadow: var(--shadow); }
    .panel { padding: 24px; }
    .hero { padding: 28px; margin-bottom: 20px; background: linear-gradient(135deg, #fff, #f0f4ff); }
    .hero h2, .section-head h2 { margin: 0 0 7px; font-size: clamp(24px, 3vw, 30px); letter-spacing: -.03em; line-height: 1.3; }
    .hero p, .section-head p { margin: 0; color: var(--muted); }
    .section-head { display: flex; justify-content: space-between; gap: 18px; align-items: end; margin: 28px 0 14px; }
    .section-head.compact { margin-top: 0; }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 23px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 17px; border: 1px solid var(--line); border-radius: 12px; background: white; color: var(--ink); text-decoration: none; font-weight: 750; transition: transform .15s, box-shadow .15s, border-color .15s; }
    .btn:hover { transform: translateY(-1px); border-color: #b9c0cd; box-shadow: 0 7px 18px rgba(30, 40, 70, .08); }
    .btn-primary { border-color: var(--primary); background: var(--primary); color: white; }
    .btn-primary:hover { border-color: var(--primary-dark); background: var(--primary-dark); }
    .btn-danger { border-color: #f0c8ce; color: var(--danger); background: #fff8f9; }
    .btn-soft { border-color: #d8e1ff; color: var(--primary); background: var(--primary-soft); }
    .btn-lg { min-height: 54px; padding: 13px 21px; font-size: 17px; }
    .btn-block { width: 100%; }
    .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .stat { padding: 18px; }
    .stat span { display: block; color: var(--muted); font-size: 14px; font-weight: 700; }
    .stat strong { display: block; margin-top: 5px; font-size: 27px; letter-spacing: -.04em; }
    .charts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
    .mini-chart { padding: 18px; }
    .mini-chart h3 { margin: 0 0 14px; font-size: 16px; }
    .bar-row { display: grid; grid-template-columns: minmax(60px, 1fr) 2fr auto; gap: 8px; align-items: center; margin: 10px 0; font-size: 13px; }
    .bar-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { height: 8px; border-radius: 99px; background: #edf0f5; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: inherit; background: var(--primary); }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    .search { flex: 1 1 260px; position: relative; }
    .search input { padding-left: 43px; }
    .search::before { content: "⌕"; position: absolute; left: 15px; top: 9px; color: var(--muted); font-size: 22px; }
    .field, input[type="text"], input[type="email"], input[type="password"], input[type="search"], textarea, select {
      width: 100%; min-height: 48px; border: 1px solid #cfd5df; border-radius: 12px; background: white; color: var(--ink); padding: 11px 13px; outline: 0;
    }
    textarea { min-height: 126px; resize: vertical; }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(49, 87, 213, .13); }
    label.field-label { display: block; margin: 16px 0 7px; font-weight: 800; }
    .filter-group { display: flex; gap: 7px; flex-wrap: wrap; }
    .filter-btn { min-height: 42px; border: 1px solid var(--line); border-radius: 99px; background: white; padding: 8px 15px; font-weight: 750; color: #4c5566; }
    .filter-btn.active { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    .badge { display: inline-flex; align-items: center; min-height: 27px; padding: 3px 9px; border-radius: 99px; font-size: 13px; font-weight: 800; }
    .badge-slang { color: #ad3544; background: #fff0f2; }
    .badge-trend { color: #795000; background: #fff4d8; }
    .badge-loan { color: #206359; background: #e9f8f4; }
    .badge-approved { color: var(--success); background: #e8f7f1; }
    .badge-pending { color: #6e7480; background: #eff1f4; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #eceef2; vertical-align: middle; }
    th { color: #616a7c; background: #f8f9fb; font-size: 14px; }
    tbody tr:hover { background: #fbfcff; }
    td .inline-select { width: auto; min-width: 105px; min-height: 39px; padding: 6px 9px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .activity-card, .word-card, .dictionary-card { padding: 21px; }
    .activity-card h3, .word-card h3, .dictionary-card h2 { margin: 7px 0 10px; font-size: 22px; line-height: 1.35; }
    .meta-list { display: grid; gap: 9px; margin: 16px 0; }
    .meta-list div { padding: 10px 12px; border-radius: 10px; background: #f7f8fa; }
    .meta-list b { display: block; color: var(--muted); font-size: 13px; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 1px dashed #cfd4df; border-radius: var(--radius); background: rgba(255,255,255,.7); }
    .student-shell { width: min(680px, calc(100% - 28px)); margin: 0 auto; padding: 24px 0 54px; font-size: 18px; }
    .student-hero { padding: 25px; margin-bottom: 16px; }
    .student-hero h1 { margin: 5px 0 10px; font-size: clamp(27px, 8vw, 34px); line-height: 1.25; letter-spacing: -.04em; }
    .student-hero p { margin: 0; color: var(--muted); }
    .student-card { padding: 22px; margin-bottom: 14px; }
    .student-card h2 { margin: 0 0 10px; font-size: 23px; line-height: 1.35; }
    .choice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .word-submit-row { display: grid; grid-template-columns: 140px minmax(0,1fr) auto; gap: 9px; align-items: stretch; }
    .word-submit-row select { min-width: 0; }
    .choice-btn { min-height: 56px; border: 2px solid #d7dbe3; border-radius: 13px; background: white; font-weight: 850; }
    .choice-btn.active { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
    .star-row { display: flex; align-items: center; gap: 1px; margin: 9px 0 3px; }
    .star { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: #c5cad3; font-size: 37px; line-height: 1; }
    .star.on { color: #f2aa1b; }
    .star:focus-visible { outline: 3px solid rgba(49,87,213,.35); border-radius: 9px; }
    .rating-copy { color: var(--muted); font-size: 14px; }
    .mine-label { display: inline-flex; color: var(--primary); background: var(--primary-soft); border-radius: 99px; padding: 3px 9px; font-size: 12px; font-weight: 850; }
    .prompt { padding: 15px; margin: 14px 0; border-left: 4px solid var(--primary); border-radius: 4px 12px 12px 4px; background: var(--primary-soft); font-weight: 750; }
    .modal-layer { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(20, 25, 36, .58); backdrop-filter: blur(4px); }
    .modal-layer.qr-layer { background: rgba(20,25,36,.2); backdrop-filter: blur(1px); }
    .modal { width: min(680px, 100%); max-height: calc(100vh - 40px); overflow: auto; border-radius: 20px; background: white; box-shadow: 0 25px 80px rgba(0,0,0,.25); }
    .modal.wide { width: min(1040px, 100%); }
    .modal.fullscreen { display: flex; flex-direction: column; width: calc(100vw - 32px); height: calc(100svh - 32px); max-height: none; overflow: hidden; border-radius: 22px; }
    .modal.fullscreen .modal-head { flex: 0 0 auto; }
    .modal.fullscreen .modal-body { flex: 1 1 auto; min-height: 0; overflow: auto; }
    .modal.fullscreen .modal-foot { flex: 0 0 auto; border-top: 1px solid var(--line); background: #fff; }
    .modal.qr-modal { width: min(780px, calc(100vw - 40px)); }
    .modal.qr-modal .modal-head { cursor: grab; user-select: none; }
    .modal.qr-modal .modal-head:active { cursor: grabbing; }
    .modal.is-draggable { position: fixed; margin: 0; }
    .modal-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; gap: 15px; align-items: center; padding: 20px 22px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); }
    .modal-head h2 { margin: 0; font-size: 23px; }
    .icon-btn { display: grid; place-items: center; width: 42px; height: 42px; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: white; font-size: 23px; }
    .modal-body { padding: 22px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 9px; padding: 16px 22px 22px; }
    .qr-box { display: grid; place-items: center; width: min(500px, 100%); min-height: 500px; margin: 0 auto 18px; padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: white; }
    .qr-box img, .qr-box canvas { max-width: 100%; height: auto !important; }
    .url-box { padding: 12px; border-radius: 10px; background: #f2f4f8; color: #4f5868; font-size: 13px; word-break: break-all; }
    .drag-hint { margin: 0 0 13px; color: var(--muted); font-size: 12px; text-align: center; }
    .qr-full .modal { width: min(94vw, 920px); }
    .qr-full .qr-box { width: min(68vh, 720px); min-height: min(68vh, 720px); }
    .confirm-copy { font-size: 18px; }
    .toast-region { position: fixed; z-index: 90; right: 18px; bottom: 18px; display: grid; gap: 9px; width: min(360px, calc(100% - 36px)); }
    .toast { padding: 14px 17px; border-radius: 12px; color: white; background: #303847; box-shadow: var(--shadow); animation: toast-in .2s ease-out; }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    @keyframes toast-in { from { transform: translateY(9px); opacity: 0; } }
    .loading-layer { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(245,246,249,.76); backdrop-filter: blur(2px); }
    .loading-card { display: flex; gap: 13px; align-items: center; padding: 17px 21px; border-radius: 14px; background: white; box-shadow: var(--shadow); font-weight: 800; }
    .spinner { width: 24px; height: 24px; border: 3px solid #dce3fa; border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .login { width: min(480px, calc(100% - 30px)); margin: 10vh auto; padding: 30px; }
    .login h1 { margin: 0 0 8px; font-size: 30px; }
    .login p { color: var(--muted); }
    .home-shell { width: min(1180px, calc(100% - 48px)); max-width: 100%; min-width: 0; margin: 0 auto; padding: 28px 0 34px; }
    .home-topbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 54px; }
    .home-identity { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; font-weight: 900; letter-spacing: -.035em; }
    .metaphor-mark { position: relative; display: block; width: 38px; height: 38px; border-radius: 50%; background: #183f4a; box-shadow: inset 0 0 0 9px #dfe9e3; }
    .metaphor-mark::before, .metaphor-mark::after { content: ""; position: absolute; border-radius: 50%; background: #e76c50; }
    .metaphor-mark::before { width: 7px; height: 7px; right: 1px; top: 2px; }
    .metaphor-mark::after { width: 4px; height: 4px; right: -7px; top: 0; background: #eebc6b; }
    .home-meta { color: #7b817d; font-size: 12px; font-weight: 800; letter-spacing: .14em; }
    .home-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(390px, .82fr); gap: clamp(46px, 7vw, 88px); align-items: center; min-height: 550px; padding: 54px 0 66px; }
    .home-copy { min-width: 0; }
    .home-copy .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: #66726d; font-size: 12px; letter-spacing: .13em; }
    .home-copy .eyebrow::before { content: ""; width: 22px; height: 1px; background: #e76c50; }
    .home-hero h1 { max-width: 670px; margin: 20px 0 24px; color: #16282d; font-size: clamp(48px, 6.2vw, 76px); font-weight: 820; line-height: 1.08; letter-spacing: -.065em; }
    .home-hero h1 em { color: #d9583f; font-family: Georgia, "Noto Serif KR", serif; font-weight: 500; }
    .home-hero .home-lead { max-width: 580px; margin: 0; color: #586763; font-size: clamp(17px, 1.8vw, 20px); line-height: 1.8; }
    .home-principles { display: flex; gap: 24px; margin-top: 32px; color: #243b40; font-size: 13px; font-weight: 800; }
    .home-principles span { display: inline-flex; align-items: center; gap: 8px; }
    .home-principles i { width: 6px; height: 6px; border-radius: 50%; background: #e76c50; box-shadow: 0 0 0 5px rgba(231,108,80,.1); }
    .home-visual { position: relative; width: 100%; max-width: 500px; justify-self: end; aspect-ratio: 1 / .92; overflow: hidden; border-radius: 34px; background: #17383e; box-shadow: 0 30px 75px rgba(23,56,62,.18); isolation: isolate; }
    .home-visual::before { content: ""; position: absolute; width: 330px; height: 330px; right: -100px; top: -110px; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; box-shadow: 0 0 0 55px rgba(255,255,255,.018), 0 0 0 110px rgba(255,255,255,.012); }
    .home-visual::after { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .35; background-image: radial-gradient(rgba(255,255,255,.24) .7px, transparent .7px); background-size: 17px 17px; -webkit-mask-image: linear-gradient(to bottom right, black, transparent 72%); mask-image: linear-gradient(to bottom right, black, transparent 72%); }
    .flow-art { position: absolute; inset: 0; width: 100%; height: 100%; }
    .flow-line { fill: none; stroke: rgba(222,236,228,.62); stroke-width: 1.4; }
    .flow-line.secondary { stroke: rgba(222,236,228,.18); stroke-width: 1; }
    .flow-orbit { fill: none; stroke: rgba(238,188,107,.55); stroke-width: 1; stroke-dasharray: 4 7; }
    .flow-seed { fill: #e76c50; }
    .flow-seed.glow { filter: drop-shadow(0 0 16px rgba(231,108,80,.85)); }
    .flow-stone { fill: #f1c27a; }
    .visual-index { position: absolute; left: 28px; top: 27px; color: rgba(235,242,237,.62); font-size: 10px; font-weight: 800; letter-spacing: .18em; writing-mode: vertical-rl; }
    .visual-caption { position: absolute; left: 30px; right: 30px; bottom: 27px; display: flex; justify-content: space-between; align-items: end; gap: 20px; color: #f1f4ef; }
    .visual-caption strong { display: block; max-width: 255px; font-size: 20px; line-height: 1.45; letter-spacing: -.025em; }
    .visual-caption span { color: rgba(241,244,239,.55); font-size: 11px; letter-spacing: .13em; }
    .home-entry-area { padding: 34px 0 10px; border-top: 1px solid #d8d9d1; }
    .entry-heading { display: flex; justify-content: space-between; align-items: end; gap: 30px; margin-bottom: 18px; }
    .entry-heading p { margin: 0; color: #d9583f; font-size: 12px; font-weight: 900; letter-spacing: .12em; }
    .entry-heading h2 { max-width: 480px; margin: 5px 0 0; font-size: clamp(26px, 3vw, 36px); line-height: 1.25; letter-spacing: -.045em; }
    .entry-heading > span { max-width: 330px; color: #727b77; font-size: 14px; text-align: right; }
    .home-entry-grid { display: grid; width: 100%; min-width: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 12px; border-radius: 28px; background: #e7e7df; }
    .home-entry-card { position: relative; min-width: 0; padding: clamp(24px, 3.2vw, 34px); overflow: hidden; border: 0; border-radius: 19px; box-shadow: none; }
    .home-entry-card:first-child { background: #fffefa; }
    .home-entry-card:last-child { background: #f8f7f1; }
    .entry-card-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .entry-number { color: #9da39f; font: 700 11px/1 Georgia, serif; letter-spacing: .12em; }
    .entry-symbol { position: relative; display: block; width: 36px; height: 18px; border-top: 1px solid #a8b4af; }
    .entry-symbol::before, .entry-symbol::after { content: ""; position: absolute; top: -4px; width: 7px; height: 7px; border-radius: 50%; }
    .entry-symbol::before { left: 0; background: #e76c50; }
    .entry-symbol::after { right: 0; background: #17383e; }
    .home-entry-card h2 { margin: 18px 0 5px; font-size: 25px; letter-spacing: -.04em; }
    .home-entry-card > p { min-height: 52px; margin: 0 0 17px; color: var(--muted); }
    .home-entry-card .btn { border-radius: 11px; }
    .home-entry-card:last-child .btn { border-color: #c8ccc7; background: transparent; }
    .login-choice-grid { display: grid; width: 100%; min-width: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 18px; }
    .role-card { position: relative; min-width: 0; padding: clamp(24px, 4vw, 36px); overflow: hidden; }
    .role-kicker { display: inline-flex; padding: 5px 9px; border-radius: 6px; color: var(--primary); background: var(--primary-soft); font-size: 12px; font-weight: 900; letter-spacing: .08em; }
    .role-card h2 { position: relative; margin: 12px 0 6px; font-size: 27px; letter-spacing: -.035em; }
    .role-card > p { position: relative; margin: 0 0 20px; color: var(--muted); }
    .class-code-input { text-align: center; text-transform: uppercase; letter-spacing: .18em; font-size: 22px; font-weight: 900; }
    .class-code-input::placeholder { color: #bcc2bf; opacity: 1; letter-spacing: .03em; font-size: 15px; font-weight: 600; }
    .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .home-footer { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 22px; padding: 0 4px; color: var(--muted); font-size: 13px; }
    .text-link { color: var(--muted); text-decoration: none; border-bottom: 1px solid #bfc4bd; }
    .teacher-choice { width: min(980px, calc(100% - 30px)); margin: 0 auto; padding: 42px 0 64px; }
    .teacher-choice-head { margin-bottom: 20px; padding: 28px; }
    .teacher-choice-head h1 { margin: 4px 0 7px; }
    .class-summary { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 18px 22px; margin-bottom: 18px; background: #173f49; color: white; border-radius: var(--radius); }

      .student-hero-icon { flex-basis:38px; width:38px; height:38px; border-radius:11px 11px 11px 5px; }

      .lab-workspace .student-hero h1 { margin:0; font-size:21px; line-height:1.25; }
      .lab-workspace .student-hero p { display:none; }
      .lab-workspace .student-card { padding:15px; margin-bottom:8px; border-radius:16px; }
      .student-form-heading { gap:9px; margin-bottom:10px; }
      .student-form-heading .student-hero-icon { flex-basis:34px; width:34px; height:34px; }
      .student-form-heading h2 { font-size:18px; }
      .student-form-heading p { display:none; }
      .student-card label.field-label { margin:11px 0 5px; font-size:13px; }
      #studentWord { min-height:52px; padding:11px 12px; font-size:16px; }
      .category-choices { gap:6px; margin:9px 0 13px; }
      .category-choice { flex-direction:column; gap:3px; min-height:58px; padding:6px 2px; font-size:12px; }

      .lab-workspace .lesson-hero { padding:17px; }
      .lab-workspace .simple-panel,.lab-workspace .context-grid,.lab-workspace .refine-grid,.lab-workspace .launch-grid { max-height:none; }
      .results-overview { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .review-progress { grid-template-columns:1fr 1fr; }

      .modal.fullscreen { width:calc(100vw - 16px); height:calc(100svh - 16px); max-height:none; }
      .modal-head, .modal-body { padding: 17px; }
      .modal-foot { padding: 12px 17px 17px; flex-direction: column-reverse; }
      .modal-foot .btn { width: 100%; }
      .qr-box { min-height: 280px; }
      .participation-warning { grid-template-columns:1fr; gap:10px; }

    }
    @media (max-width: 420px) {
      .lab-home-copy h1 { font-size:clamp(43px,12.5vw,48px); }
      .student-lesson-tab { gap:3px; padding:6px 2px; }

      .student-tab-icon svg { width:13px; height:13px; }
      .lab-home-copy .lab-lead { font-size:14px; line-height:1.65; }
      .lab-home-hero { padding-top:34px; }
      .lab-student-entry, .lab-teacher-entry { padding:20px; }
    }
    @media print {
      @page { size: A4; margin: 18mm 15mm; }
      body { background: white; color: #111; font-size: 11pt; }
      .no-print, .admin-nav, .app-header, .toolbar, button, .toast-region, .modal-layer, .loading-layer { display: none !important; }
      .shell, .student-shell { width: 100%; margin: 0; padding: 0; }
      .dictionary-cover { color: #111; background: none; border: 2px solid #222; box-shadow: none; }
      .dictionary-list { display: block; }
      .dictionary-card { margin: 0 0 10mm; box-shadow: none; border: 1px solid #aaa; break-inside: avoid; page-break-inside: avoid; }
      .badge { border: 1px solid #777; color: #111; background: white; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <div id="modalRoot"></div>
  <div id="loading" class="loading-layer hidden" role="status" aria-live="polite"><div class="loading-card"><span class="spinner"></span><span id="loadingText">불러오는 중...</span></div></div>
  <div id="toasts" class="toast-region" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./supabase-api.js"></script>
  <script>
    'use strict';
    const query = new URLSearchParams(location.search);
    const studentActivityViews = ['submit', 'rate', 'context', 'wordmaking', 'dictionary'];
    const allowedViews = ['home', 'student', 'teacher', 'admin'];
    const requestedView = query.get('view') || 'home';
    const normalizedView = studentActivityViews.includes(requestedView) ? 'student' : requestedView;
    const CONFIG = Object.freeze(Object.assign({}, window.APP_CONFIG || {}, {
      view: allowedViews.includes(normalizedView) ? normalizedView : 'home',
      taskId: String(query.get('taskId') || '').slice(0, 80),
      wordId: String(query.get('wordId') || '').slice(0, 80),
      step: /^[1-4]$/.test(query.get('step') || '') ? query.get('step') : '',
      classCode: String(query.get('code') || '').replace(/[^a-z0-9]/gi, '').toUpperCase().slice(0, 12),
      baseUrl: location.origin + location.pathname
    }));
    const CATEGORIES = ['비속어', '유행어', '외래어'];
    const CLASS_STAGES = [
      { id: 'waiting', label: '수업 대기' },
      { id: 'submit', label: '1차시 · 발견' },
      { id: 'rate', label: '1차시 · 발견' },
      { id: 'context', label: '2차시 · 진단' },
      { id: 'wordmaking', label: '3차시 · 설계' },
      { id: 'dictionary', label: '4차시 · 검증' }
    ];
    const state = {
      anonId: getAnonId(),
      adminToken: sessionStorage.getItem('koreanClassAdminToken') || '',
      teacherToken: sessionStorage.getItem('koreanClassTeacherToken') || '',
      activeClass: null,
      classInfo: null,
      stageTimer: null,
      tab: 'words',
      dashboard: null,
      wordFilter: '전체', wordSearch: '',
      contextShowRatings: false,
      usabilityLesson: null,
      usabilityScore: 0,
      makingWords: [],
      redesignReviewId: '',
      redesignReviewScores: {},
      dictionarySearch: '',
      wordmakingWorkspace: [],
      publishedDictionary: { entries: [], usageTrackingEnabled: false },
      abLesson: null,
      abAnswers: {},
      abOrders: {},
      unloadParticipationEnded: false
    };

    document.addEventListener('DOMContentLoaded', boot);
    window.addEventListener('beforeunload', endActiveParticipationOnUnload);
    window.addEventListener('pagehide', endActiveParticipationOnUnload);
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        const layer = document.querySelector('.modal-layer');
        if (layer) layer.classList.remove('qr-full');
      }
    });

    async function boot() {
      try {
        if (CONFIG.view === 'home') return renderHomeView();
        document.body.classList.remove('home-page', 'lab-home');
        document.body.classList.add('lab-workspace');
        await AppApi.init(CONFIG.view);
        if (CONFIG.view === 'student') {
          state.anonId = await api('getStudentUuid');
          localStorage.setItem('student_uuid', state.anonId);
          return enterStudentPortal(CONFIG.classCode || localStorage.getItem('koreanClassCode') || '');
        }
        if (CONFIG.view === 'teacher') {
          const savedToken = await AppApi.getTeacherToken();
          if (savedToken) {
            state.teacherToken = savedToken;
            sessionStorage.setItem('koreanClassTeacherToken', savedToken);
            await closeParticipationRememberedBeforeReload();
            return loadTeacherPortal();
          }
          return renderTeacherEntry();
        }
        if (CONFIG.view === 'admin') {
          const savedToken = await AppApi.getAdminToken();
          if (savedToken) {
            state.adminToken = savedToken;
            sessionStorage.setItem('koreanClassAdminToken', savedToken);
          }
          return renderAdminEntry();
        }
        renderError('지원하지 않는 화면입니다.');
      } catch (error) {
        renderError(error && error.message ? error.message : String(error));
      }
    }

    function getAnonId() {
      let id = localStorage.getItem('student_uuid');
      if (/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id || '')) return id;
      id = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, character => {
            const value = Math.random() * 16 | 0;
            return (character === 'x' ? value : (value & 3 | 8)).toString(16);
          });
      localStorage.setItem('student_uuid', id);
      return id;
    }

    function api(name, ...args) {
      return AppApi.call(name, ...args);
    }

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }
    function attr(value) { return esc(value).replace(/`/g, '&#96;'); }
    function jsArg(value) { return esc(JSON.stringify(String(value == null ? '' : value))); }
    function categoryClass(category) { return category === '비속어' ? 'badge-slang' : category === '외래어' ? 'badge-loan' : 'badge-trend'; }
    function badge(category) { return `<span class="badge ${categoryClass(category)}">${esc(category)}</span>`; }
    function formatScore(value) { return Number(value) ? Number(value).toFixed(1) : '-'; }
    function summarizeUsabilityTests(tests) {
      const answered = (tests || []).filter(item => Number(item.responseCount));
      const responseCount = answered.reduce((sum, item) => sum + Number(item.responseCount || 0), 0);
      const averageScore = responseCount ? answered.reduce((sum, item) => sum + Number(item.averageScore || 0) * Number(item.responseCount || 0), 0) / responseCount : 0;
      const values = answered.map(item => Number(item.averageScore || 0));
      const rangeScore = values.length > 1 ? Math.max(...values) - Math.min(...values) : 0;
      return { averageScore, responseCount, situationCount:(tests || []).length, rangeScore, rangeLabel:values.length < 2 ? '판단 대기' : rangeScore < .8 ? '좁음' : rangeScore < 1.6 ? '보통' : '넓음' };
    }
    function usabilityProfileHtml(profile) {
      const item = profile || {};
      return `<div class="usability-profile"><span>표현 평균<b>${item.responseCount?formatScore(item.averageScore)+'점':'응답 대기'}</b></span><span>상황별 편차<b>${item.responseCount?formatScore(item.rangeScore):'-'}</b></span><span>사용 범위<b>${esc(item.rangeLabel||'판단 대기')}</b></span></div>`;
    }
    function setApp(html) { document.getElementById('app').innerHTML = html; }
    function showLoading(text) { document.getElementById('loadingText').textContent = text || '불러오는 중...'; document.getElementById('loading').classList.remove('hidden'); }
    function hideLoading() { document.getElementById('loading').classList.add('hidden'); }
    function toast(message, type) {
      const item = document.createElement('div');
      item.className = 'toast ' + (type || ''); item.textContent = message;
      document.getElementById('toasts').appendChild(item);
      setTimeout(() => item.remove(), 3300);
    }
    function friendlyError(error) {
      const message = error && error.message ? error.message : '요청을 처리하지 못했습니다.';
      if (/인증이 만료/.test(message)) {
        if (CONFIG.view === 'admin') {
          sessionStorage.removeItem('koreanClassAdminToken'); state.adminToken = '';
          renderAdminEntry();
        } else if (CONFIG.view === 'teacher') {
          sessionStorage.removeItem('koreanClassTeacherToken'); state.teacherToken = '';
          renderTeacherEntry();
        }
      }
      toast(message, 'error');
      return message;
    }
    function setButtonBusy(button, busy, label) {
      if (!button) return;
      if (busy) { button.dataset.originalText = button.textContent; button.disabled = true; button.textContent = label || '저장 중...'; }
      else { button.disabled = false; button.textContent = button.dataset.originalText || button.textContent; }
    }

    function lessonIcon(stage) {
      const paths = {
        submit: '<circle cx="10" cy="10" r="5.4"/><path d="m14.2 14.2 4.3 4.3M7.7 10h4.6M10 7.7v4.6"/>',
        context: '<rect x="3" y="4" width="18" height="16" rx="4"/><path d="M6.5 12h3l1.6-4 2.5 8 1.8-4h2.1"/>',
        wordmaking: '<path d="m5 17 1.2-4.2L15.8 3.2a1.7 1.7 0 0 1 2.4 0l.6.6a1.7 1.7 0 0 1 0 2.4l-9.6 9.6L5 17Z"/><path d="m13.8 5.2 5 5M4 20h16"/>',
        dictionary: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16ZM20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z"/><path d="m15.3 9.2 1.3 1.3 2.2-2.5"/>'
      };
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[stage]||paths.submit}</svg>`;
    }

    function categoryIcon(category) {
      const paths = {
        '비속어': '<path d="M12 3 2.8 19h18.4L12 3Z"/><path d="M12 9v4M12 16h.01"/>',
        '유행어': '<path d="m4 15 5-5 4 4 7-8"/><path d="M15 6h5v5"/>',
        '외래어': '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 2.5 3.6 5.5 3.6 9S14.4 18.5 12 21M12 3C9.6 5.5 8.4 8.5 8.4 12S9.6 18.5 12 21"/>'
      };
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[category]||paths['유행어']}</svg>`;
    }

    function endActiveParticipationOnUnload() {
      if (CONFIG.view !== 'teacher' || state.unloadParticipationEnded || !state.activeClass || state.activeClass.currentStage === 'waiting') return;
      state.unloadParticipationEnded = true;
      AppApi.deactivateClassOnUnload(state.activeClass.id);
      state.activeClass.currentStage = 'waiting';
      state.activeClass.currentTaskId = '';
    }

    function rememberParticipation(stage, classId) {
      if (stage === 'waiting') sessionStorage.removeItem('koreanActiveParticipationClass');
      else sessionStorage.setItem('koreanActiveParticipationClass', String(classId || ''));
    }

    async function closeParticipationRememberedBeforeReload() {
      const classId = sessionStorage.getItem('koreanActiveParticipationClass') || '';
      if (!/^[0-9a-f-]{36}$/i.test(classId)) {
        sessionStorage.removeItem('koreanActiveParticipationClass');
        return;
      }
      try {
        await api('setClassStage', state.teacherToken, classId, 'waiting', '');
        sessionStorage.removeItem('koreanActiveParticipationClass');
      } catch (_) {
        // 이탈 시 keepalive 종료 요청이 먼저 처리될 수 있습니다. 다음 입장에서 다시 확인합니다.
      }
    }

    function studentHeader(title, description) {
      const room = state.classInfo;
      const roomLine = room ? `<div class="class-summary no-print" style="margin-bottom:12px"><div><p class="eyebrow" style="color:#f0b9aa">참여 중인 클래스</p><strong>${esc(room.school)} · ${esc(room.grade)} ${esc(room.className)}</strong></div><span class="class-code-badge">${esc(room.classCode)}</span><div class="header-actions"><button class="btn" onclick="leaveStudentClass()">나가기</button></div></div>` : '';
      const qrStage = CONFIG.step === '1' ? 'submit' : CONFIG.step === '2' ? 'context' : CONFIG.step === '3' ? 'wordmaking' : CONFIG.step === '4' ? 'dictionary' : '';
      const current = qrStage || (room && (room.currentStage === 'rate' ? 'submit' : room.currentStage));
      const showLessonIcon = ['submit','context','wordmaking','dictionary'].includes(current);
      const tabs = room ? `<nav class="student-lesson-tabs no-print" aria-label="수업 차시"><span class="student-lesson-tab ${current==='submit'?'active':''}"><span class="student-tab-icon">${lessonIcon('submit')}</span><span class="student-tab-copy"><small>1차시</small><b>발견</b></span></span><span class="student-lesson-tab ${current==='context'?'active':''}"><span class="student-tab-icon">${lessonIcon('context')}</span><span class="student-tab-copy"><small>2차시</small><b>진단</b></span></span><span class="student-lesson-tab ${current==='wordmaking'?'active':''}"><span class="student-tab-icon">${lessonIcon('wordmaking')}</span><span class="student-tab-copy"><small>3차시</small><b>설계</b></span></span><span class="student-lesson-tab ${current==='dictionary'?'active':''}"><span class="student-tab-icon">${lessonIcon('dictionary')}</span><span class="student-tab-copy"><small>4차시</small><b>검증</b></span></span></nav>` : '';
      return `<div class="student-shell">${roomLine}${tabs}<header class="student-hero card"><p class="eyebrow">말을 다시 디자인하다</p><div class="student-hero-heading">${showLessonIcon?`<span class="student-hero-icon">${lessonIcon(current)}</span>`:''}<div><h1>${esc(title)}</h1><p>${esc(description || '')}</p></div></div></header><div id="studentContent"></div></div>`;
    }

    function renderHomeView() {
      document.body.classList.remove('lab-workspace');
      document.body.classList.add('home-page', 'lab-home');
      setApp(`<div class="lab-home-shell">
        <nav class="lab-home-nav" aria-label="시작 화면"><a class="lab-home-brand" href="${attr(CONFIG.baseUrl)}"><span class="lab-home-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5.5 5.5h9a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3h-4.8L6 18.5v-3.1a3 3 0 0 1-2.5-2.9v-4a3 3 0 0 1 2-3Z"/><path d="M9 9h5M9 12h3"/><path d="M17.5 9.5h1a2 2 0 0 1 2 2v5.5l-2.5-1.8"/></svg></span><span>우리말 바로쓰기</span></a><span class="lab-home-status">SYSTEM READY · 익명 참여</span><a class="lab-admin-link" href="${attr(appUrl('admin'))}">관리자</a></nav>
        <header class="lab-home-hero">
          <div class="lab-home-copy"><p class="lab-kicker">우리말 리디자인 프로젝트</p><h1>우리말,<br><span>다시 디자인하다.</span></h1><p class="lab-lead">비속어·유행어·외래어를 수집하고, 더 나은 우리말로 재구성합니다.</p></div>
          <div class="lab-network" aria-hidden="true"><svg viewBox="0 0 800 610"><path class="lab-net-line" d="M80 430 C180 280 240 390 327 257 S530 70 720 142"/><path class="lab-net-line alt" d="M90 185 C215 98 277 170 349 248 S535 420 730 340"/><path class="lab-net-line" d="M155 540 C260 430 385 480 451 365 S579 198 738 230"/><g transform="translate(90 430)"><circle class="lab-node-ring" r="34"/><circle class="lab-node" r="4"/><text class="lab-node-label" x="-22" y="54">DISCOVER</text></g><g transform="translate(349 248)"><circle class="lab-node-ring" r="57"/><circle class="lab-node alt" r="6"/><text class="lab-node-label" x="-29" y="80">DIAGNOSE</text></g><g transform="translate(535 420)"><circle class="lab-node-ring" r="38"/><circle class="lab-node" r="4"/><text class="lab-node-label" x="-28" y="60">DESIGN</text></g><g transform="translate(720 142)"><circle class="lab-node-ring" r="72"/><circle class="lab-node alt" r="8"/><text class="lab-node-label" x="-23" y="98">VERIFY</text></g></svg></div>
        </header>
        <section class="lab-access" aria-label="역할별 수업 입장">
          <div class="lab-access-intro"><small>ACCESS TERMINAL</small><h2>수업 연결</h2><p>역할에 맞는 방법으로 시작하세요.</p></div>
          <form id="studentEntryForm" class="lab-student-entry"><label class="lab-entry-label" for="homeClassCode">STUDENT · 클래스 코드</label><div class="lab-field-row"><input id="homeClassCode" class="class-code-input" minlength="4" maxlength="12" autocomplete="off" placeholder="코드" required><button class="btn" type="submit">연결</button></div></form>
          <form id="teacherEntryForm" class="lab-teacher-entry"><label class="lab-entry-label" for="homeTeacherPassword">TEACHER · 교사 비밀번호</label><div class="lab-teacher-fields"><input id="homeTeacherPassword" type="password" autocomplete="off" placeholder="비밀번호" required><button class="btn" type="submit">교사 입장</button></div></form>
        </section>
      </div>`);
      const codeInput = document.getElementById('homeClassCode');
      codeInput.addEventListener('input', () => { codeInput.value = codeInput.value.replace(/[^a-z0-9]/gi, '').toUpperCase(); });
      document.getElementById('studentEntryForm').addEventListener('submit', event => {
        event.preventDefault();
        const code = codeInput.value.trim().toUpperCase();
        if (!/^[A-Z0-9]{4,12}$/.test(code)) return toast('클래스 코드는 영문·숫자 4~12자리입니다.', 'error');
        location.href = appUrl('student', { code });
      });
      document.getElementById('teacherEntryForm').addEventListener('submit', event => loginTeacher(event, 'homeTeacherPassword'));
    }

    async function loginTeacher(event, passwordId) {
      event.preventDefault();
      const button = event.submitter; setButtonBusy(button, true, '로그인 중...');
      try {
        await AppApi.init('teacher');
        const result = await api('verifyTeacherCode', document.getElementById(passwordId).value);
        state.teacherToken = result.token;
        sessionStorage.setItem('koreanClassTeacherToken', result.token);
        location.href = appUrl('teacher');
      } catch (error) { friendlyError(error); setButtonBusy(button, false); }
    }

    function renderError(message) {
      setApp(`<section class="error-panel card"><p class="eyebrow">안내</p><h1>화면을 열 수 없습니다</h1><p>${esc(message)}</p><div class="actions"><a class="btn" href="${attr(CONFIG.baseUrl)}">시작 화면으로</a><button class="btn btn-primary" onclick="location.reload()">다시 시도</button></div></section>`);
    }

    /* ------------------------------ 교사 화면 ------------------------------ */
    function renderTeacherEntry() {
      setApp(`<form id="teacherLoginForm" class="login card">
        <p class="eyebrow">TEACHER</p><h1>교사 입장</h1><p>수업용 교사 비밀번호를 입력해 주세요.</p>
        <label class="field-label" for="teacherPassword">교사 비밀번호</label><input id="teacherPassword" type="password" autocomplete="off" required>
        <button class="btn btn-primary btn-lg btn-block" type="submit" style="margin-top:16px">교사 공간 입장</button>
        <a class="btn btn-block" href="${attr(CONFIG.baseUrl)}" style="margin-top:9px">처음으로</a>
      </form>`);
      document.getElementById('teacherLoginForm').addEventListener('submit', event => loginTeacher(event, 'teacherPassword'));
    }

    function loadTeacherPortal() {
      renderTeacherChoice();
      if (sessionStorage.getItem('koreanOpenClassRecovery') === '1') {
        sessionStorage.removeItem('koreanOpenClassRecovery');
        openClassCodeRecovery();
      }
    }

    function renderTeacherChoice() {
      setApp(`<div class="teacher-choice">
        <header class="teacher-choice-head card"><p class="eyebrow">교사 공간</p><h1>클래스 관리</h1><p>새 클래스를 만들거나 기존 클래스 코드로 관리 화면에 입장하세요.</p>
          <div class="hero-actions"><button class="btn" onclick="logoutTeacherAccount()">로그아웃</button><a class="btn" href="${attr(CONFIG.baseUrl)}">처음으로</a></div></header>
        <section class="login-choice-grid">
          <form id="createClassForm" class="role-card card">
            <span class="role-kicker">NEW CLASS</span><h2>새 클래스 개설</h2><p>학교 정보와 사용할 클래스 코드를 직접 정해 주세요.</p>
            <div class="form-row"><div><label class="field-label" for="classRegion">지역</label><input id="classRegion" type="text" maxlength="80" placeholder="예: 서울" required></div>
            <div><label class="field-label" for="classSchool">학교명</label><input id="classSchool" type="text" maxlength="160" placeholder="예: 한빛고등학교" required></div></div>
            <div class="form-row"><div><label class="field-label" for="classGrade">학년</label><select id="classGrade" required><option value="">선택</option><option>1학년</option><option>2학년</option><option>3학년</option></select></div>
            <div><label class="field-label" for="className">반</label><input id="className" type="text" maxlength="40" placeholder="예: 3반" required></div></div>
            <label class="field-label" for="newClassCode">사용할 클래스 코드</label><input id="newClassCode" class="class-code-input" type="text" minlength="4" maxlength="12" autocomplete="off" placeholder="영문·숫자 4~12자리" required>
            <p class="help">학생에게 알려 줄 코드입니다. 이미 사용 중인 코드는 등록할 수 없습니다.</p>
            <label class="field-label" for="classRecoveryHint">클래스 코드 찾기 힌트</label><input id="classRecoveryHint" type="password" maxlength="120" autocomplete="new-password" placeholder="본인만 기억할 답을 입력하세요" required>
            <p class="help">코드를 잊었을 때 학급 정보와 이 힌트를 정확히 입력해 찾습니다.</p>
            <button class="btn btn-primary btn-lg btn-block" type="submit" style="margin-top:18px">클래스 개설하기</button>
          </form>
          <form id="enterTeacherClassForm" class="role-card card">
            <span class="role-kicker">ENTER CLASS</span><h2>기존 클래스 입장</h2><p>전에 개설한 클래스의 코드를 입력하세요.</p>
            <label class="field-label" for="teacherClassCode">클래스 코드</label><input id="teacherClassCode" class="class-code-input" type="text" minlength="4" maxlength="12" autocomplete="off" placeholder="영문·숫자 4~12자리" required>
            <button class="btn btn-lg btn-block" type="submit" style="margin-top:14px">클래스 입장</button>
            <button class="btn btn-soft btn-block" type="button" style="margin-top:9px" onclick="openClassCodeRecovery()">클래스 코드 찾기</button>
            <p class="help" style="margin-top:18px">교사 권한으로 들어가려면 매번 해당 클래스 코드를 직접 입력해야 합니다.</p>
          </form>
        </section>
      </div>`);
      const codeInput = document.getElementById('teacherClassCode');
      codeInput.addEventListener('input', () => { codeInput.value = codeInput.value.replace(/[^a-z0-9]/gi, '').toUpperCase(); });
      const newCodeInput = document.getElementById('newClassCode');
      newCodeInput.addEventListener('input', () => { newCodeInput.value = newCodeInput.value.replace(/[^a-z0-9]/gi, '').toUpperCase(); });
      document.getElementById('createClassForm').addEventListener('submit', createTeacherClass);
      document.getElementById('enterTeacherClassForm').addEventListener('submit', event => { event.preventDefault(); openTeacherClass(codeInput.value); });
    }

    async function createTeacherClass(event) {
      event.preventDefault(); const button = event.submitter; setButtonBusy(button, true, '개설 중...');
      const payload = { region: document.getElementById('classRegion').value, school: document.getElementById('classSchool').value, grade: document.getElementById('classGrade').value, className: document.getElementById('className').value, classCode: document.getElementById('newClassCode').value, recoveryHint: document.getElementById('classRecoveryHint').value };
      try {
        const created = await api('createTeacherClass', state.teacherToken, payload);
        toast('클래스가 개설되었습니다.', 'success');
        await openTeacherClass(created.classCode);
      } catch (error) { friendlyError(error); setButtonBusy(button, false); }
    }

    async function openTeacherClass(classCode) {
      const code = String(classCode || '').replace(/[^a-z0-9]/gi, '').toUpperCase();
      if (!/^[A-Z0-9]{4,12}$/.test(code)) return toast('클래스 코드는 영문·숫자 4~12자리입니다.', 'error');
      showLoading('클래스에 입장하는 중...');
      try {
        state.activeClass = await api('enterTeacherClass', state.teacherToken, code);
        await loadTeacherClassDashboard(true);
      } catch (error) { friendlyError(error); }
      finally { hideLoading(); }
    }

    function openClassCodeRecovery() {
      openModal('클래스 코드 찾기', `<form id="classRecoveryForm">
        <p class="help">클래스를 개설할 때 입력한 내용을 모두 정확히 적어 주세요.</p>
        <div class="form-row"><div><label class="field-label" for="recoverRegion">지역</label><input id="recoverRegion" type="text" maxlength="80" required></div>
        <div><label class="field-label" for="recoverSchool">학교명</label><input id="recoverSchool" type="text" maxlength="160" required></div></div>
        <div class="form-row"><div><label class="field-label" for="recoverGrade">학년</label><select id="recoverGrade" required><option value="">선택</option><option>1학년</option><option>2학년</option><option>3학년</option></select></div>
        <div><label class="field-label" for="recoverClassName">반</label><input id="recoverClassName" type="text" maxlength="40" required></div></div>
        <label class="field-label" for="recoverHint">클래스 코드 찾기 힌트</label><input id="recoverHint" type="password" maxlength="120" autocomplete="off" required>
      </form>`, `<button class="btn" onclick="closeModal()">취소</button><button id="recoverClassBtn" class="btn btn-primary" onclick="recoverClassCode()">코드 찾기</button>`);
      document.getElementById('classRecoveryForm').addEventListener('submit', event => { event.preventDefault(); recoverClassCode(); });
    }

    async function recoverClassCode() {
      const form = document.getElementById('classRecoveryForm');
      if (!form || !form.reportValidity()) return;
      const button = document.getElementById('recoverClassBtn'); setButtonBusy(button, true, '찾는 중...');
      const payload = {
        region: document.getElementById('recoverRegion').value,
        school: document.getElementById('recoverSchool').value,
        grade: document.getElementById('recoverGrade').value,
        className: document.getElementById('recoverClassName').value,
        recoveryHint: document.getElementById('recoverHint').value
      };
      try {
        const matches = await api('recoverTeacherClassCode', state.teacherToken, payload);
        if (!matches.length) { toast('입력한 정보와 일치하는 클래스가 없습니다.', 'error'); setButtonBusy(button, false); return; }
        openModal('찾은 클래스 코드', `<p class="help">코드를 복사한 뒤 기존 클래스 입장란에 직접 입력해 주세요.</p><div class="grid">${matches.map(item => `<article class="activity-card card"><p class="eyebrow">${esc(item.region)} · ${esc(item.school)}</p><h3 class="class-code-input" style="margin-top:14px">${esc(item.classCode)}</h3><p class="help">${esc(item.grade)} ${esc(item.className)}</p><div class="card-actions"><button class="btn btn-primary" onclick="copyUrl('${attr(item.classCode)}','클래스 코드를')">코드 복사</button></div></article>`).join('')}</div>`, `<button class="btn" onclick="closeModal()">닫기</button>`, true);
      } catch (error) { friendlyError(error); setButtonBusy(button, false); }
    }

    async function loadTeacherClassDashboard(silent) {
      if (!state.activeClass) return renderTeacherChoice();
      if (!silent) showLoading('클래스 자료를 불러오는 중...');
      try {
        state.dashboard = await api('getClassDashboard', state.teacherToken, state.activeClass.id);
        renderTeacherClassShell();
      } catch (error) { friendlyError(error); }
      finally { if (!silent) hideLoading(); }
    }

    function renderTeacherClassShell() {
      const room = state.activeClass;
      const tabs = ['lesson1','lesson2','lesson3','lesson4'];
      if (!tabs.includes(state.tab)) {
        state.tab = room.currentStage === 'context' ? 'lesson2' : room.currentStage === 'wordmaking' ? 'lesson3' : room.currentStage === 'dictionary' ? 'lesson4' : 'lesson1';
      }
      setApp(`<div class="shell teacher-workspace">
        <header class="teacher-top no-print"><span class="mini-mark">LAB</span><div><h1>${esc(room.school)} ${esc(room.grade)} ${esc(room.className)}</h1><p>${esc(room.region)} · 디지털 언어 연구실</p></div>
          <div class="teacher-top-actions"><button class="btn code-button" onclick="copyUrl('${attr(room.classCode)}','클래스 코드를')">${esc(room.classCode)}</button><button class="btn" onclick="refreshTeacherDashboard()">새로고침</button><button class="btn btn-danger" onclick="confirmResetClass()">결과 초기화</button><button class="btn" onclick="leaveTeacherClass()">메인 화면</button></div></header>
        <nav class="lesson-tabs no-print" aria-label="차시 선택">
          <button class="lesson-tab ${state.tab==='lesson1'?'active':''}" data-lesson="lesson1"><span class="lesson-tab-icon">${lessonIcon('submit')}</span><span class="lesson-tab-copy"><small>1차시</small><b>발견</b></span></button>
          <button class="lesson-tab ${state.tab==='lesson2'?'active':''}" data-lesson="lesson2"><span class="lesson-tab-icon">${lessonIcon('context')}</span><span class="lesson-tab-copy"><small>2차시</small><b>진단</b></span></button>
          <button class="lesson-tab ${state.tab==='lesson3'?'active':''}" data-lesson="lesson3"><span class="lesson-tab-icon">${lessonIcon('wordmaking')}</span><span class="lesson-tab-copy"><small>3차시</small><b>설계</b></span></button>
          <button class="lesson-tab ${state.tab==='lesson4'?'active':''}" data-lesson="lesson4"><span class="lesson-tab-icon">${lessonIcon('dictionary')}</span><span class="lesson-tab-copy"><small>4차시</small><b>검증</b></span></button>
        </nav><main id="teacherLessonContent"></main></div>`);
      document.querySelectorAll('[data-lesson]').forEach(button => button.addEventListener('click', () => requestTeacherTab(button.dataset.lesson)));
      renderTeacherLessonTab();
    }

    function leaveTeacherClass() {
      const leave = () => { state.activeClass = null; state.dashboard = null; state.tab = 'lesson1'; renderTeacherChoice(); };
      if (!isParticipationOpen()) return leave();
      confirmParticipationClose('메인 화면으로 이동하면 현재 학생 참여 링크와 QR이 비활성화됩니다.', leave, 'QR 종료 후 이동');
    }

    function isParticipationOpen() {
      return Boolean(state.activeClass && state.activeClass.currentStage !== 'waiting');
    }

    async function closeStudentParticipation() {
      if (!isParticipationOpen()) return;
      state.activeClass = await api('setClassStage', state.teacherToken, state.activeClass.id, 'waiting', '');
      rememberParticipation('waiting');
      state.unloadParticipationEnded = false;
    }

    function confirmParticipationClose(message, onContinue, confirmLabel) {
      openModal('학생 참여 QR 비활성화', `<div class="participation-warning"><span class="participation-warning-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/><path d="m8 8 8 8M16 8l-8 8"/></svg></span><div><h3>학생 참여가 종료됩니다</h3><p>${esc(message)}</p></div></div>`, `<button class="btn" onclick="closeModal()">취소</button><button id="confirmParticipationClose" class="btn btn-primary">${esc(confirmLabel || 'QR 비활성화')}</button>`);
      document.getElementById('confirmParticipationClose').addEventListener('click', async event => {
        const button = event.currentTarget;
        setButtonBusy(button, true, '종료 중...');
        try {
          await closeStudentParticipation();
          closeModal();
          toast('학생 참여 QR이 비활성화되었습니다.', 'success');
          onContinue();
        } catch (error) {
          friendlyError(error);
          setButtonBusy(button, false);
        }
      });
    }

    function requestTeacherTab(nextTab) {
      if (nextTab === state.tab) return;
      const move = () => { state.tab = nextTab; renderTeacherClassShell(); };
      if (!isParticipationOpen()) return move();
      confirmParticipationClose('다른 차시 탭으로 이동하면 현재 학생 참여 링크와 QR이 비활성화됩니다.', move, 'QR 종료 후 이동');
    }

    async function refreshTeacherDashboard() {
      if (!isParticipationOpen()) return loadTeacherClassDashboard();
      showLoading('학생 참여를 종료하고 새로고침하는 중...');
      try {
        await closeStudentParticipation();
        state.dashboard = await api('getClassDashboard', state.teacherToken, state.activeClass.id);
        renderTeacherClassShell();
        toast('학생 참여 QR을 종료하고 새로고침했습니다.', 'success');
      } catch (error) { friendlyError(error); }
      finally { hideLoading(); }
    }

    function confirmResetClass() {
      confirmModal('수업 결과 초기화', '수집 표현과 사용성 테스트, 리디자인, A/B 검증, 사전 결과가 모두 삭제됩니다. 이 작업은 되돌릴 수 없습니다.', async () => {
        const button = document.getElementById('confirmAction'); setButtonBusy(button, true, '초기화 중...');
        try { await api('resetClassResults', state.teacherToken, state.activeClass.id); rememberParticipation('waiting'); closeModal(); toast('수업 결과를 초기화했습니다.', 'success'); state.activeClass.currentStage='waiting'; await loadTeacherClassDashboard(true); }
        catch (error) { friendlyError(error); setButtonBusy(button, false); }
      }, '모든 결과 초기화');
    }

    function teacherLessonHero(title, description, stage) {
      const active = stage === 'submit'
        ? ['submit','rate'].includes(state.activeClass.currentStage)
        : state.activeClass.currentStage === stage;
      return `<section class="lesson-hero lesson-hero-${attr(stage)}"><span class="lesson-number">${lessonIcon(stage)}</span><div class="lesson-copy"><h2>${esc(title)}</h2><p>${esc(description)}</p></div><div class="lesson-actions">${active?`<span class="live-pill">학생 화면에 진행 중</span><button class="btn btn-primary" onclick="openLessonQr('${attr(stage)}')">참여 QR 다시 띄우기</button>`:`<button class="btn btn-primary" onclick="startClassStage('${attr(stage)}','',true)">차시 시작</button>`}${state.activeClass.currentStage!=='waiting'?'<button class="btn" onclick="startClassStage(\'waiting\')">학생 화면 닫기</button>':''}</div></section>`;
    }

    function lessonQrInfo(tab) {
      return ({
        lesson1: { step:'1', stage:'submit', label:'1차시 · 발견', title:'우리 반 언어 데이터 수집' },
        lesson2: { step:'2', stage:'context', label:'2차시 · 진단', title:'말의 사용성 테스트' },
        lesson3: { step:'3', stage:'wordmaking', label:'3차시 · 설계', title:'언어 UX 리디자인 LAB' },
        lesson4: { step:'4', stage:'dictionary', label:'4차시 · 검증', title:'블라인드 테스트 및 출시' }
      })[tab] || { step:'1', stage:'submit', label:'1차시 · 발견', title:'우리 반 언어 데이터 수집' };
    }

    function openLessonQr(stage) {
      const tab = stage === 'context' ? 'lesson2' : stage === 'wordmaking' ? 'lesson3' : stage === 'dictionary' ? 'lesson4' : 'lesson1';
      const info = lessonQrInfo(tab);
      const url = appUrl('student', { code:state.activeClass.classCode, step:info.step });
      openQr(url, `${info.label} · ${info.title} 참여 QR`);
    }

    function renderTeacherLessonTab() {
      if (state.tab === 'lesson1') return renderTeacherLessonOne();
      if (state.tab === 'lesson2') return renderTeacherLessonTwo();
      if (state.tab === 'lesson3') return renderTeacherLessonThree();
      return renderTeacherLessonFour();
    }

    async function startClassStage(stage, taskId, showQr) {
      if (stage === 'context' && !(state.dashboard.tasks || []).some(item=>item.active)) { toast('활성화된 사용성 테스트를 먼저 만들어 주세요.', 'error'); return; }
      if (stage === 'wordmaking' && !(state.dashboard.words || []).length) { toast('1차시에서 표현을 먼저 수집해 주세요.', 'error'); return; }
      if (stage === 'dictionary' && !(state.dictionaryWorkspace || []).some(item => (item.suggestions || []).some(candidate => candidate.abTest && candidate.abTest.active))) { toast('활성화된 블라인드 A/B 검증 항목을 먼저 만들어 주세요.', 'error'); return; }
      showLoading('학생 화면을 전환하는 중...');
      try {
        state.activeClass = await api('setClassStage', state.teacherToken, state.activeClass.id, stage, taskId || '');
        rememberParticipation(stage, state.activeClass.id);
        state.unloadParticipationEnded = false;
        toast('학생 화면이 전환되었습니다.', 'success'); renderTeacherClassShell();
        if (showQr && stage !== 'waiting') openLessonQr(stage);
      } catch (error) { friendlyError(error); }
      finally { hideLoading(); }
    }

    function renderTeacherLessonOne() {
      const root = document.getElementById('teacherLessonContent'); if (!root) return;
      const words = state.dashboard.words || [];
      root.innerHTML = `${teacherLessonHero('발견: 우리 반 언어 데이터 수집','학생들이 실제로 쓰는 표현을 수집하고 빈도와 유형으로 관찰합니다.','submit')}
        <div class="lesson-tools"><div><h3>수집된 언어</h3><p>‘새로고침’을 누르면 최신 결과를 불러옵니다.</p></div><div class="actions"><span class="count">${words.length}개 표현</span><button class="btn btn-results" onclick="openStudentResults('lesson1')">학생 응답 결과</button></div></div>
        <section class="simple-panel card"><div class="simple-list">${words.length ? words.map(word => `<div class="simple-row"><div class="simple-word">${esc(word.word)}<small>${word.submissionCount}회 등록</small></div><select class="inline-select" aria-label="${attr(word.word)} 유형 변경" onchange="changeWordCategory('${attr(word.id)}',this)">${CATEGORIES.map(category=>`<option ${category===word.category?'selected':''}>${category}</option>`).join('')}</select><div class="row-actions actions"><button class="btn icon-danger" onclick="confirmDeleteWord('${attr(word.id)}',${jsArg(word.word)})">삭제</button></div></div>`).join('') : '<div class="empty">학생이 표현을 입력하면 이곳에 나타납니다.</div>'}</div></section>`;
    }

    async function renderTeacherLessonTwo() {
      const root = document.getElementById('teacherLessonContent'); if (!root) return;
      const words = state.dashboard.words || [];

ive?'비활성화':'활성화'}</button><button class="btn icon-danger" onclick="confirmDeleteTask('${attr(test.id)}')">삭제</button></div></article>`).join(''):'<div class="empty">첫 사용성 테스트를 만들어 주세요.</div>'}</section>`;

on-danger" onclick="confirmDeleteAbTest('${attr(candidate.abTest.id)}')">검증 삭제</button>`:`<button class="btn btn-primary" onclick="createAbTest('${attr(candidate.id)}',this)">A/B 검증에 추가</button>`}<button class="btn ${item.entry&&item.entry.suggestionId===candidate.id?'':'btn-primary'}" onclick="approveDictionaryCandidate('${attr(item.id)}','${attr(candidate.id)}',this)">${item.entry&&item.entry.suggestionId===candidate.id?'등재 내용 갱신':'사전에 등재'}</button></span></div>`).join(''):'<span class="help">3차시 리디자인 설계안을 먼저 모아 주세요.</span>'}</div>${item.entry&&item.entry.approved?`<div class="rating-summary"><span class="help">이번 주 실제 사용 ${item.entry.usageCount||0}건</span><button class="btn btn-danger" onclick="unpublishDictionaryEntry('${attr(item.id)}',this)">등재 취소</button></div>`:''}</article>`).join(''):'<div class="empty">3차시 리디자인 설계안을 먼저 모아 주세요.</div>'}</section>`;

    function resultStat(label, value) {
      return `<div class="results-stat"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
    }

    function abResultHtml(test) {
      const labels={clarity:'쉽게 이해됨',natural:'자연스러움',universal:'누구나 사용',usage:'실제 사용 선택'};
      const metrics=test&&test.metrics||{};
      return `<div class="ab-result">${Object.keys(labels).map(key=>{const item=metrics[key]||{aPercent:0,samePercent:0,bPercent:0};return `<div class="ab-result-row"><b>${labels[key]}</b><div class="ab-bars"><span class="bar-a" style="width:${item.aPercent}%">A ${item.aPercent}%</span><span class="bar-same" style="width:${item.samePercent}%">같음 ${item.samePercent}%</span><span class="bar-b" style="width:${item.bPercent}%">B ${item.bPercent}%</span></div></div>`;}).join('')}</div>`;
    }

    function openStudentResults(step) {
      const room = state.activeClass;
      if (!room) return;
      let title = '학생 응답 결과';
      let overview = '';
      let content = '';

      if (step === 'lesson1') {
        const words = state.dashboard.words || [];
        const submissions = words.reduce((sum, item) => sum + Number(item.submissionCount || 0), 0);
        const topWord = words[0];
        title = '1차시 발견: 우리 반 언어 데이터 수집';
        overview = resultStat('고유 표현', `${words.length}개`) + resultStat('전체 등록', `${submissions}회`) + resultStat('가장 많이 나온 말', topWord ? topWord.word : '-') + resultStat('최고 빈도', topWord ? `${topWord.submissionCount}회` : '-');
        content = `<section class="simple-panel card"><div class="simple-list">${words.length ? words.map((word, index) => `<div class="simple-row"><div class="simple-word"><span class="eyebrow">RANK ${String(index + 1).padStart(2, '0')}</span>${esc(word.word)}<small>${esc(word.category)}</small></div>${badge(word.category)}<span class="submission-count">${word.submissionCount}회</span></div>`).join('') : '<div class="empty">아직 수집된 학생 응답이 없습니다.</div>'}</div></section>`;
      } else if (step === 'lesson2') {
        const tests = (state.usabilityWorkspace && state.usabilityWorkspace.tests) || [];
        const responses = tests.reduce((sum, item) => sum + Number(item.responseCount || 0), 0);
        const weighted = responses ? tests.reduce((sum, item) => sum + Number(item.averageScore || 0) * Number(item.responseCount || 0), 0) / responses : 0;
        title = '2차시 진단: 말의 사용성 테스트';
        overview = resultStat('테스트', `${tests.length}개`) + resultStat('전체 응답', `${responses}건`) + resultStat('활성 테스트', `${tests.filter(item => item.active).length}개`) + resultStat('전체 평균', responses ? `${formatScore(weighted)}점` : '-');
        content = `<section class="context-grid">${tests.length ? tests.map((test, index) => `<article class="context-card card"><div class="rating-summary"><p class="eyebrow">TEST ${String(index + 1).padStart(2, '0')}</p><span class="score-pill">${test.responseCount ? formatScore(test.averageScore) + '점' : '응답 대기'}</span></div><h3>${esc(test.word)}</h3><div class="test-facts"><div class="test-fact"><b>상황</b>${esc(test.situation)}</div><div class="test-fact"><b>상대</b>${esc(test.audience)}</div><div class="test-fact"><b>목적</b>${esc(test.purpose)}</div></div><div class="average-bar"><span>${test.responseCount}명 응답</span><span class="average-track"><i class="average-fill" style="width:${Number(test.averageScore || 0) * 20}%"></i></span><b>${formatScore(test.averageScore)}</b></div></article>`).join('') : '<div class="empty">아직 만들어진 사용성 테스트가 없습니다.</div>'}</section>`;
      } else if (step === 'lesson3') {
        const groups = state.wordmakingWorkspace || [];
        const suggestions = groups.flatMap(group => (group.suggestions || []).map(suggestion => ({ group, suggestion })));
        const reviews = suggestions.reduce((sum, item) => sum + Number(item.suggestion.reviewCount || 0), 0);
        const reviewed = suggestions.filter(item => item.suggestion.reviewCount);
        const averageScore = reviewed.length ? reviewed.reduce((sum, item) => sum + Number(item.suggestion.overallScore || 0), 0) / reviewed.length : 0;
        title = '3차시 설계: 언어 UX 리디자인 LAB';
        overview = resultStat('원래 표현', `${groups.length}개`) + resultStat('리디자인 제안', `${suggestions.length}개`) + resultStat('동료 평가', `${reviews}건`) + resultStat('제안 평균', reviewed.length ? `${formatScore(averageScore)}점` : '-');
        content = `<section class="refine-grid">${suggestions.length ? suggestions.map(({group, suggestion}) => `<article class="refine-card card"><p class="eyebrow">${badge(group.category)} · ${esc(group.word)}</p><h3>${esc(group.word)} → <span style="color:var(--primary)">${esc(suggestion.suggestedWord)}</span></h3>${usabilityProfileHtml(group.usability)}<p class="intent-copy"><b>전달하려는 의미</b>${esc(suggestion.meaning)}</p><p class="intent-copy"><b>핵심 특징</b>${esc(suggestion.coreFeature)}</p><p class="help">${esc(suggestion.reason)}</p><div class="review-progress"><span class="metric-chip">의미 보존성<b>${formatScore(suggestion.meaningScore)}</b></span><span class="metric-chip">자연스러움<b>${formatScore(suggestion.naturalScore)}</b></span><span class="metric-chip">보편성<b>${formatScore(suggestion.universalScore)}</b></span><span class="metric-chip">명확성<b>${formatScore(suggestion.clarityScore)}</b></span></div><div class="rating-summary"><span class="help">${suggestion.reviewCount}명 평가</span><span class="score-pill">평균 ${formatScore(suggestion.overallScore)}점</span></div></article>`).join('') : '<div class="empty">아직 등록된 리디자인 설계안이 없습니다.</div>'}</section>`;
      } else {
        const groups = state.dictionaryWorkspace || [];
        const candidates = groups.flatMap(group => (group.suggestions || []).map(candidate => ({ group, candidate })));
        const tests = candidates.filter(item => item.candidate.abTest);
        const responses = tests.reduce((sum, item) => sum + Number(item.candidate.abTest.responseCount || 0), 0);
        const published = groups.filter(item => item.entry && item.entry.approved).length;
        const leader = tests.slice().sort((a,b)=>Number(b.candidate.abTest.improvementScore)-Number(a.candidate.abTest.improvementScore))[0];
        title = '4차시 검증: 블라인드 테스트 및 출시';

        content = `<section class="launch-grid">${tests.length ? tests.map(({group,candidate}) => `<article class="launch-card card"><div class="rating-summary"><p class="eyebrow">${badge(group.category)} · ${candidate.abTest.responseCount}명 응답</p><span class="improvement-pill">사용성 향상 ${candidate.abTest.improvementScore>0?'+':''}${candidate.abTest.improvementScore}%</span></div><h3>${esc(group.word)} → <span style="color:var(--primary)">${esc(candidate.suggestedWord)}</span></h3>${abResultHtml(candidate.abTest)}</article>`).join('') : '<div class="empty">아직 A/B 검증 결과가 없습니다.</div>'}</section>`;
      }

      openModal(`${room.grade} ${room.className} · ${title}`, `<div class="fullscreen-results"><div class="results-overview">${overview}</div>${content}</div>`, '<button class="btn btn-primary" onclick="closeModal()">결과 화면 닫기</button>', 'fullscreen');

    /* ------------------------------ 학생 클래스 ------------------------------ */
    async function enterStudentPortal(classCode) {
      const code = String(classCode || '').replace(/[^a-z0-9]/gi, '').toUpperCase();
      if (!/^[A-Z0-9]{4,12}$/.test(code)) {
        renderError('선생님에게 받은 영문·숫자 4~12자리 클래스 코드를 입력해 주세요.');
        return;
      }
      showLoading('클래스에 입장하는 중...');
      try {
        state.classInfo = await api('joinClass', code);
        localStorage.setItem('koreanClassCode', state.classInfo.classCode);
        renderStudentStage();
        startStudentStageWatcher();
      } catch (error) { renderError(error && error.message ? error.message : String(error)); }
      finally { hideLoading(); }
    }

    function startStudentStageWatcher() {
      if (state.stageTimer) clearInterval(state.stageTimer);
      state.stageTimer = setInterval(async () => {
        if (!state.classInfo || document.hidden) return;
        try {
          const latest = await api('getStudentClassState', state.classInfo.id);
          const changed = latest.currentStage !== state.classInfo.currentStage || latest.currentTaskId !== state.classInfo.currentTaskId;
          state.classInfo = latest;
          if (changed) { toast('수업 단계가 바뀌었습니다.', 'success'); renderStudentStage(); }
        } catch (_) { /* 다음 확인 주기에 다시 시도합니다. */ }
      }, 5000);
    }

    function renderStudentStage() {
      if (!state.classInfo) return;
      const stage = state.classInfo.currentStage;
      const requestedStage = CONFIG.step === '1' ? 'submit' : CONFIG.step === '2' ? 'context' : CONFIG.step === '3' ? 'wordmaking' : CONFIG.step === '4' ? 'dictionary' : '';
      const requestedOpen = !requestedStage || (requestedStage === 'submit' ? ['submit','rate'].includes(stage) : requestedStage === stage);
      if (!requestedOpen) {
        const info = lessonQrInfo('lesson' + CONFIG.step);
        setApp(studentHeader(`${info.label} 활동을 준비하고 있어요`, `이 QR은 ‘${info.title}’ 전용입니다. 선생님이 이 차시를 시작하면 자동으로 열립니다.`));
        document.getElementById('studentContent').innerHTML = `<section class="waiting-panel card"><div class="waiting-glyph">${esc(CONFIG.step)}</div><h2>지금은 이 차시가 열려 있지 않아요</h2><p class="help">화면을 닫지 않아도 수업이 시작되면 자동으로 활동 화면으로 바뀝니다.</p></section>`;
        return;
      }
      if (stage === 'submit' || stage === 'rate') return renderSubmitView();
      if (stage === 'context') return renderContextView();
      if (stage === 'wordmaking') return renderWordmakingView();
      if (stage === 'dictionary') return renderDictionaryView();
      setApp(studentHeader('수업을 준비하고 있어요', '선생님이 차시를 시작하면 이 화면이 자동으로 바뀝니다.'));
      document.getElementById('studentContent').innerHTML = `<section class="waiting-panel card"><div class="waiting-glyph">✦</div><h2>조금만 기다려 주세요</h2><p class="help">우리 반 네 차시 활동이 곧 시작됩니다.</p></section>`;
    }

    function leaveStudentClass() {
      if (state.stageTimer) clearInterval(state.stageTimer);
      localStorage.removeItem('koreanClassCode');
      state.classInfo = null;
      location.href = CONFIG.baseUrl;
    }

    function renderStudentWordResults(){const root=document.getElementById('lessonOneStudentList');if(!root)return;const filter=state.studentWordFilter||'전체';const words=(state.studentWordResults||[]).filter(word=>filter==='전체'||word.category===filter);root.innerHTML=`<div class="lesson-tools"><div><h3>수집 목록 · ${words.length}</h3><p>등록 횟수가 많은 순서입니다.</p></div><button class="btn" onclick="loadLessonOneStudentWords()" aria-label="목록 새로고침">↻ 새로고침</button></div>${filterButtons('student-word',filter)}<section class="simple-panel card" style="margin-top:8px">${words.length?words.map(word=>`<div class="result-row"><div><strong>${esc(word.word)}</strong><small>${esc(word.category)}</small></div><span class="submission-count">${word.submissionCount}회</span></div>`).join(''):'<div class="empty">표현이 아직 없습니다.</div>'}</section>`;root.querySelectorAll('[data-student-word-filter]').forEach(button=>button.addEventListener('click',()=>{state.studentWordFilter=button.dataset.studentWordFilter;renderStudentWordResults();}));}

    async function renderContextView() {

    function renderUsabilityTask(){const root=document.getElementById('studentContent');const tests=(state.usabilityLesson&&state.usabilityLesson.tests)||[];if(state.contextShowRatings)return renderUsabilityResults();const pending=tests.find(test=>!test.myScore);const completed=tests.filter(test=>test.myScore).length;if(!tests.length){root.innerHTML='<div class="empty">선생님이 사용성 테스트를 준비하고 있습니다.</div>';return;}if(!pending){root.innerHTML=`<section class="waiting-panel card"><div class="waiting-glyph">✓</div><h2>테스트를 모두 완료했습니다.</h2><p class="help">상황에 따라 같은 표현의 적절성이 어떻게 달라지는지 결과에서 확인해 보세요.</p><button class="btn btn-primary btn-lg" onclick="state.contextShowRatings=true;renderUsabilityTask()">결과 보기</button></section>`;return;}root.innerHTML=`<div class="lesson-tools"><div><h3>${completed+1} / ${tests.length}</h3><p>학생에게는 한 번에 테스트 하나만 표시됩니다.</p></div><button class="btn" onclick="state.contextShowRatings=true;renderUsabilityTask()">결과 보기</button></div><article class="student-card usability-card card"><p class="eyebrow">테스트할 말</p><h2>${esc(pending.word)}</h2>${badge(pending.category)}<div class="test-facts"><div class="test-fact"><b>상황</b>${esc(pending.situation)}</div><div class="test-fact"><b>상대</b>${esc(pending.audience)}</div><div class="test-fact"><b>목적</b>${esc(pending.purpose)}</div></div><h3 style="margin-top:24px">이 상황에서 이 표현을 사용하는 것은 얼마나 적절할까요?</h3><div class="score-scale">${[1,2,3,4,5].map(score=>`<button type="button" class="score-choice" data-usability-score="${score}">${score}</button>`).join('')}</div><div class="scale-labels"><span>1 · 매우 부적절</span><span>5 · 매우 적절</span></div><button id="submitUsabilityBtn" class="btn btn-primary btn-lg btn-block" style="margin-top:22px" disabled>제출하기</button></article>`;root.querySelectorAll('[data-usability-score]').forEach(button=>button.addEventListener('click',()=>{state.usabilityScore=Number(button.dataset.usabilityScore);root.querySelectorAll('[data-usability-score]').forEach(item=>item.classList.toggle('active',item===button));document.getElementById('submitUsabilityBtn').disabled=false;}));document.getElementById('submitUsabilityBtn').addEventListener('click',event=>submitUsabilityScore(pending.id,event.currentTarget));}
    async function submitUsabilityScore(testId,button){if(!state.usabilityScore)return toast('적절성 점수를 선택해 주세요.','error');setButtonBusy(button,true,'제출 중...');try{await api('saveUsabilityResponse',state.anonId,testId,state.usabilityScore);toast('평가를 제출했습니다.','success');state.usabilityScore=0;state.usabilityLesson=await api('getUsabilityLesson',state.anonId,state.classInfo.id);renderUsabilityTask();window.scrollTo({top:0,behavior:'smooth'});}catch(error){friendlyError(error);setButtonBusy(button,false);}}
    function renderUsabilityResults(){const root=document.getElementById('studentContent');const tests=(state.usabilityLesson&&state.usabilityLesson.tests)||[];const grouped=tests.reduce((all,test)=>{(all[test.word]||=[]).push(test);return all;},{});root.innerHTML=`<button class="btn btn-block" onclick="state.contextShowRatings=false;renderUsabilityTask()" style="margin-bottom:12px">← 테스트로 돌아가기</button><div class="lesson-tools"><div><h3>우리 반 사용성 진단</h3><p>표현 평균과 상황별 편차를 함께 확인합니다.</p></div><button class="btn" onclick="renderContextView()">↻ 새로고침</button></div>${Object.keys(grouped).length?Object.entries(grouped).map(([word,items])=>`<article class="student-card card"><h2>${esc(word)}</h2>${usabilityProfileHtml(summarizeUsabilityTests(items))}${items.map(test=>`<div class="average-bar"><span>${esc(test.audience)} · ${esc(test.situation)}</span><span class="average-track"><i class="average-fill" style="width:${test.averageScore*20}%"></i></span><b>${test.responseCount?formatScore(test.averageScore):'-'}</b></div>`).join('')}</article>`).join(''):'<div class="empty">아직 표시할 결과가 없습니다.</div>'}`;}

    /* ------------------------------ 우리말 만들기 학생 ------------------------------ */
    async function renderWordmakingView() {
      setApp(studentHeader('설계: 언어 UX 리디자인 LAB', '진단 결과를 근거로 의미는 살리고 더 잘 통하는 표현을 설계해요.'));

    function renderMakingContent(){

      const form=document.getElementById('suggestionForm');if(form){form.addEventListener('submit',submitSuggestion);document.getElementById('redesignWord').addEventListener('change',renderSelectedUsabilityProfile);}

    function renderSelectedUsabilityProfile(){const root=document.getElementById('selectedUsabilityProfile');const select=document.getElementById('redesignWord');if(!root||!select)return;const word=state.makingWords.find(item=>item.id===select.value);root.innerHTML=word?`<p class="eyebrow" style="margin-top:12px">2차시 사용성 진단</p>${usabilityProfileHtml(word.usability)}`:'';}
