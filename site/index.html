    }

    async function loadLessonOneStudentWords() {
      const root = document.getElementById('lessonOneStudentList'); if (!root) return;
      try {
        const words = await api('getApprovedWords', state.anonId, state.classInfo.id);
        if (!document.getElementById('lessonOneStudentList')) return;
        state.studentWordResults=words;state.studentWordFilter=state.studentWordFilter||'전체';renderStudentWordResults();
      } catch (error) { root.innerHTML = `<div class="empty">${esc(friendlyError(error))}</div>`; }
    }

    function renderStudentWordResults(){const root=document.getElementById('lessonOneStudentList');if(!root)return;const filter=state.studentWordFilter||'전체';const words=(state.studentWordResults||[]).filter(word=>filter==='전체'||word.category===filter);root.innerHTML=`<div class="lesson-tools"><div><h3>수집 목록 · ${words.length}</h3><p>등록 횟수가 많은 순서입니다.</p></div><button class="btn" onclick="loadLessonOneStudentWords()" aria-label="목록 새로고침">↻ 새로고침</button></div>${filterButtons('student-word',filter)}<section class="simple-panel card" style="margin-top:8px">${words.length?words.map(word=>`<div class="result-row"><div><strong>${esc(word.word)}</strong><small>${esc(word.category)}</small></div><span class="submission-count">${word.submissionCount}회</span></div>`).join(''):'<div class="empty">표현이 아직 없습니다.</div>'}</section>`;root.querySelectorAll('[data-student-word-filter]').forEach(button=>button.addEventListener('click',()=>{state.studentWordFilter=button.dataset.studentWordFilter;renderStudentWordResults();}));}

    function renderRateView() { return renderSubmitView(); }

    /* ------------------------------ 상황 활동 학생 ------------------------------ */
    async function renderContextView() {
      setApp(studentHeader('2차시 · 맥락 진단', '표현을 고르고, 어울리는 경우와 그렇지 않은 경우를 직접 만들어 봐요.'));
      document.getElementById('studentContent').innerHTML = `<div class="empty">표현 목록을 불러오는 중...</div>`;
      state.diagnosticDraft = null;
      try {
        state.diagnosticLesson = await api('getDiagnosticLesson', state.anonId, state.classInfo.id);
        const card = state.diagnosticLesson.myCard;
        state.diagnosticStep = card ? (card.complete ? 4 : 2) : 1;
        if (card) state.diagnosticDraft = diagnosticDraftFromCard(card);
        renderDiagnosticFlow();
      } catch (error) {
        const root=document.getElementById('studentContent'); if(root)root.innerHTML=`<div class="empty">${esc(friendlyError(error))}</div>`;
      }
    }

    function diagnosticDraftFromCard(card) {
      return {
        dimensions:(card.dimensions||[]).slice(),
        appropriate:Object.assign({partner:'',place:'',situation:'',example:'',rating:0},card.appropriate||{}),
        inappropriate:Object.assign({partner:'',place:'',situation:'',example:'',rating:0},card.inappropriate||{}),
        ratingReason:card.ratingReason||''
      };
    }

    function diagnosticStepper(step) {
      return `<div class="context-stepper"><span class="context-step ${step===1?'active':''}"><b>1</b>표현 선택</span><span class="context-step ${step===2?'active':''}"><b>2</b>맥락·예문</span><span class="context-step ${step>=3?'active':''}"><b>3</b>평가·이유</span></div>`;
    }

    function renderDiagnosticFlow() {
      const root=document.getElementById('studentContent'); if(!root||!state.diagnosticLesson)return;
      const card=state.diagnosticLesson.myCard;
      if(!card)return renderDiagnosticWordChoice();
      if(card.complete||state.diagnosticStep===4)return renderCompletedDiagnostic();
      if(state.diagnosticStep===3)return renderDiagnosticRating();
      renderDiagnosticContexts();
    }

    function renderDiagnosticWordChoice() {
      const root=document.getElementById('studentContent');const lesson=state.diagnosticLesson;
      root.innerHTML=`${diagnosticStepper(1)}<article class="student-card card"><div class="student-form-heading"><span class="student-hero-icon">${lessonIcon('context')}</span><div><h2>진단할 표현 선택</h2><p>한 번 선택하면 바꿀 수 없습니다.</p></div></div><section class="diagnostic-word-grid">${lesson.words.length?lesson.words.map(word=>`<button type="button" class="diagnostic-word ${word.full?'full':''}" ${word.full?'disabled':''} onclick="confirmDiagnosticWord('${attr(word.id)}',${jsArg(word.word)})"><div class="rating-summary">${badge(word.category)}<span class="badge ${word.full?'badge-pending':'badge-approved'}">${word.full?'마감':word.remainingCount+'자리'}</span></div><strong>${esc(word.word)}</strong><small>${word.selectedCount} / ${lesson.capacity}명</small></button>`).join(''):'<div class="empty">선택할 표현이 아직 없습니다.</div>'}</section></article>`;
    }

    function confirmDiagnosticWord(wordId, word) {
      confirmModal('이 표현을 선택할까요?', `‘${word}’의 쓰임을 직접 진단합니다. 선택 후에는 다른 표현으로 바꿀 수 없습니다.`, async()=>{
        const button=document.getElementById('confirmAction');setButtonBusy(button,true,'선택 중...');
        try{await api('claimDiagnosticWord',state.anonId,state.classInfo.id,wordId);closeModal();state.diagnosticLesson=await api('getDiagnosticLesson',state.anonId,state.classInfo.id);state.diagnosticStep=2;state.diagnosticDraft=diagnosticDraftFromCard(state.diagnosticLesson.myCard);renderDiagnosticFlow();toast('표현을 선택했습니다.','success');}
        catch(error){friendlyError(error);setButtonBusy(button,false);}
      },'이 표현 선택');
    }

    function diagnosticDimensionField(key,label,placeholder) {
      const draft=state.diagnosticDraft;
      if(!draft.dimensions.includes(key))return '';
      const suffix=key.charAt(0).toUpperCase()+key.slice(1);
      return `<label class="field-label" for="appropriate${suffix}">${label}</label><input id="appropriate${suffix}" maxlength="${key==='situation'?500:200}" required placeholder="${esc(placeholder[0])}" value="${attr(draft.appropriate[key])}"><label class="field-label" for="inappropriate${suffix}">${label}</label><input id="inappropriate${suffix}" maxlength="${key==='situation'?500:200}" required placeholder="${esc(placeholder[1])}" value="${attr(draft.inappropriate[key])}">`;
    }

    function renderDiagnosticContexts() {
      const root=document.getElementById('studentContent');const card=state.diagnosticLesson.myCard;const draft=state.diagnosticDraft;
      const labels={partner:'대화 상대',place:'대화 장소',situation:'대화 상황'};
      root.innerHTML=`${diagnosticStepper(2)}<form id="diagnosticContextForm" class="student-card card"><p class="eyebrow">선택한 표현</p><h2>${esc(card.word)} ${badge(card.category)}</h2><label class="field-label" id="dimensionLabel">비교할 맥락 <span class="help">2개 이상</span></label><div class="dimension-choices" role="group" aria-labelledby="dimensionLabel">${Object.keys(labels).map(key=>`<button type="button" class="dimension-choice ${draft.dimensions.includes(key)?'active':''}" aria-pressed="${draft.dimensions.includes(key)}" onclick="toggleDiagnosticDimension('${key}')">${labels[key]}</button>`).join('')}</div><div class="context-case-grid"><section class="context-case good"><h3>✓ 적절한 경우</h3><div id="appropriateFields"></div><label class="field-label" for="appropriateExample">예문</label><textarea id="appropriateExample" maxlength="800" required placeholder="이 맥락에 맞는 예문">${esc(draft.appropriate.example)}</textarea></section><section class="context-case bad"><h3>△ 그렇지 않은 경우</h3><div id="inappropriateFields"></div><label class="field-label" for="inappropriateExample">예문</label><textarea id="inappropriateExample" maxlength="800" required placeholder="이 맥락에는 어색한 예문">${esc(draft.inappropriate.example)}</textarea></section></div><button class="btn btn-primary btn-lg btn-block" type="submit" style="margin-top:14px">평가하러 가기 →</button></form>`;
      const fields={partner:['대화 상대',['예: 친한 친구','예: 처음 만난 어른']],place:['대화 장소',['예: 운동장','예: 교장실']],situation:['대화 상황',['예: 쉬는 시간 장난','예: 공식 발표']]};
      ['partner','place','situation'].forEach(key=>{if(!draft.dimensions.includes(key))return;const [label,placeholder]=fields[key];const suffix=key.charAt(0).toUpperCase()+key.slice(1);document.getElementById('appropriateFields').insertAdjacentHTML('beforeend',`<label class="field-label" for="appropriate${suffix}">${label}</label><input id="appropriate${suffix}" maxlength="${key==='situation'?500:200}" required placeholder="${placeholder[0]}" value="${attr(draft.appropriate[key])}">`);document.getElementById('inappropriateFields').insertAdjacentHTML('beforeend',`<label class="field-label" for="inappropriate${suffix}">${label}</label><input id="inappropriate${suffix}" maxlength="${key==='situation'?500:200}" required placeholder="${placeholder[1]}" value="${attr(draft.inappropriate[key])}">`);});
      document.getElementById('diagnosticContextForm').addEventListener('submit',goDiagnosticRating);
    }

    function captureDiagnosticContexts() {
      const draft=state.diagnosticDraft;if(!draft)return;
      ['partner','place','situation'].forEach(key=>{const suffix=key.charAt(0).toUpperCase()+key.slice(1);const good=document.getElementById('appropriate'+suffix);const bad=document.getElementById('inappropriate'+suffix);if(good)draft.appropriate[key]=good.value;if(bad)draft.inappropriate[key]=bad.value;});
      const goodExample=document.getElementById('appropriateExample');const badExample=document.getElementById('inappropriateExample');if(goodExample)draft.appropriate.example=goodExample.value;if(badExample)draft.inappropriate.example=badExample.value;
    }

    function toggleDiagnosticDimension(key) {
      captureDiagnosticContexts();const selected=state.diagnosticDraft.dimensions;const index=selected.indexOf(key);if(index>=0)selected.splice(index,1);else selected.push(key);renderDiagnosticContexts();
    }

    function goDiagnosticRating(event) {
      event.preventDefault();captureDiagnosticContexts();
      if(state.diagnosticDraft.dimensions.length<2)return toast('대화 상대, 장소, 상황 중 두 가지 이상을 선택해 주세요.','error');
      if(!event.currentTarget.reportValidity())return;
      state.diagnosticStep=3;renderDiagnosticRating();window.scrollTo({top:0,behavior:'smooth'});
    }

    function starChoices(kind,score) {
      return `<div class="star-choice-row" aria-label="${kind==='appropriate'?'적절한':'그렇지 않은'} 경우 별점">${[1,2,3,4,5].map(value=>`<button type="button" class="star-choice ${value===score?'active':''}" onclick="setDiagnosticRating('${kind}',${value})" aria-label="${value}점">★</button>`).join('')}</div><div class="scale-labels"><span>1점</span><span>5점</span></div>`;
    }

    function renderDiagnosticRating() {
      const root=document.getElementById('studentContent');const card=state.diagnosticLesson.myCard;const draft=state.diagnosticDraft;
      root.innerHTML=`${diagnosticStepper(3)}<article class="student-card card"><p class="eyebrow">${badge(card.category)} · ${esc(card.word)}</p><h2>적절성을 평가해요</h2><section class="context-case good"><h3>✓ 적절한 경우</h3><p>${esc(draft.appropriate.example)}</p>${starChoices('appropriate',draft.appropriate.rating)}</section><section class="context-case bad" style="margin-top:10px"><h3>△ 그렇지 않은 경우</h3><p>${esc(draft.inappropriate.example)}</p>${starChoices('inappropriate',draft.inappropriate.rating)}</section><label class="field-label" for="diagnosticReason">왜 그렇게 평가했나요?</label><textarea id="diagnosticReason" maxlength="800" required placeholder="상대·장소·상황을 근거로 설명해 주세요.">${esc(draft.ratingReason)}</textarea><div class="card-actions"><button class="btn" type="button" onclick="backToDiagnosticContexts()">← 맥락 수정</button><button id="saveDiagnosticBtn" class="btn btn-primary" type="button" onclick="submitDiagnosticCard(this)">진단 카드 완성</button></div></article>`;
    }

    function setDiagnosticRating(kind,score){state.diagnosticDraft[kind].rating=score;const reason=document.getElementById('diagnosticReason');if(reason)state.diagnosticDraft.ratingReason=reason.value;renderDiagnosticRating();}
    function backToDiagnosticContexts(){const reason=document.getElementById('diagnosticReason');if(reason)state.diagnosticDraft.ratingReason=reason.value;state.diagnosticStep=2;renderDiagnosticContexts();}

    async function submitDiagnosticCard(button){
      const reason=document.getElementById('diagnosticReason');state.diagnosticDraft.ratingReason=reason?reason.value:'';
      if(!state.diagnosticDraft.appropriate.rating||!state.diagnosticDraft.inappropriate.rating)return toast('두 경우의 별점을 모두 선택해 주세요.','error');
      if(!state.diagnosticDraft.ratingReason.trim())return toast('별점을 준 이유를 적어 주세요.','error');
      setButtonBusy(button,true,'저장 중...');
      try{await api('saveDiagnosticCard',state.anonId,Object.assign({cardId:state.diagnosticLesson.myCard.id},state.diagnosticDraft));state.diagnosticLesson=await api('getDiagnosticLesson',state.anonId,state.classInfo.id);state.diagnosticStep=4;toast('진단 카드를 완성했습니다.','success');renderCompletedDiagnostic();window.scrollTo({top:0,behavior:'smooth'});}
      catch(error){friendlyError(error);setButtonBusy(button,false);}
    }

    function renderCompletedDiagnostic(){
      const root=document.getElementById('studentContent');const own=state.diagnosticLesson.myCard;const cards=state.diagnosticLesson.cards.filter(card=>card.complete);
      root.innerHTML=`${diagnosticStepper(4)}<section class="waiting-panel card"><div class="waiting-glyph">✓</div><h2>진단 완료</h2><p class="help">3차시에서 아래 진단 카드 중 하나를 골라 새 표현을 설계합니다.</p></section><div class="lesson-tools"><div><h3>우리 반 진단 카드 · ${cards.length}</h3><p>목록은 자동으로 갱신됩니다.</p></div><button class="btn" onclick="renderContextView()" aria-label="진단 목록 새로고침">↻</button></div><section class="context-grid">${cards.map((card,index)=>`<article class="student-card card"><p class="eyebrow">${card.id===own.id?'내 카드 · ':''}${badge(card.category)}</p><h2>${esc(card.word)}</h2><div class="diagnostic-summary"><div><b>적절한 경우 · ${card.appropriate.rating}점</b>${esc(card.appropriate.example)}</div><div><b>그렇지 않은 경우 · ${card.inappropriate.rating}점</b>${esc(card.inappropriate.example)}</div></div><p class="help">${esc(card.ratingReason)}</p></article>`).join('')}</section>`;
    }

    /* ------------------------------ 우리말 만들기 학생 ------------------------------ */
    async function renderWordmakingView() {
      setApp(studentHeader('3차시 · 새 표현 설계', '2차시 진단 카드 하나를 골라 더 잘 어울리는 표현을 만들어 봐요.'));
      document.getElementById('studentContent').innerHTML='<div class="empty">진단 카드를 불러오는 중...</div>';
      state.selectedDiagnosticId='';
      try { state.redesignCards=await api('getRedesignLesson',state.anonId,state.classInfo.id); state.makingWords=state.redesignCards; renderMakingContent(); }
      catch(error){document.getElementById('studentContent').innerHTML=`<div class="empty">${esc(friendlyError(error))}</div>`;}
    }
    function renderMakingContent(){
      const root=document.getElementById('studentContent');
      const cards=state.redesignCards||[];const available=cards.filter(card=>!card.submitted);const selected=available.find(card=>card.id===state.selectedDiagnosticId);
      if(selected){root.innerHTML=redesignFormHtml(selected);document.getElementById('suggestionForm').addEventListener('submit',submitSuggestion);return;}

    function selectDiagnosticForRedesign(cardId){state.selectedDiagnosticId=cardId;renderMakingContent();window.scrollTo({top:0,behavior:'smooth'});}
    function redesignFormHtml(card){return `<button class="btn btn-block" type="button" onclick="state.selectedDiagnosticId='';renderMakingContent()" style="margin-bottom:9px">← 진단 카드 다시 선택</button><form id="suggestionForm" class="student-card card"><p class="eyebrow">${badge(card.category)} · 선택한 진단</p><h2>${esc(card.word)}</h2><div class="diagnostic-summary"><div><b>적절한 경우 · ${card.appropriate.rating}점</b>${esc(card.appropriate.example)}</div><div><b>그렇지 않은 경우 · ${card.inappropriate.rating}점</b>${esc(card.inappropriate.example)}</div><div><b>평가 이유</b>${esc(card.ratingReason)}</div></div><label class="field-label" for="suggestedWord">새 표현</label><input id="suggestedWord" maxlength="120" required placeholder="더 잘 어울리는 표현"><label class="field-label" for="redesignMeaning">새 표현의 뜻</label><textarea id="redesignMeaning" maxlength="600" required placeholder="누구나 이해할 수 있게 간단히 설명해 주세요."></textarea><label class="field-label" for="suggestionReason">바꾼 이유</label><textarea id="suggestionReason" maxlength="600" required placeholder="진단한 상대·장소·상황과 연결해 설명해 주세요."></textarea><label class="field-label" for="redesignExample">새 예문</label><textarea id="redesignExample" maxlength="800" required placeholder="새 표현이 자연스럽게 쓰인 문장"></textarea><button class="btn btn-primary btn-lg btn-block" type="submit" style="margin-top:14px">새 표현 등록</button></form>`;}

    function renderSelectedUsabilityProfile(){}
    function getReviewableRedesigns(){return state.makingWords.flatMap(word=>(word.suggestions||[]).map(item=>Object.assign({wordId:word.id,word:word.word},item))).filter(item=>!item.mine&&!item.reviewed);}
    function openRedesignReview(){const next=getReviewableRedesigns()[0];if(!next)return toast('현재 평가할 다른 제안이 없습니다.','error');state.redesignReviewId=next.id;state.redesignReviewScores={};renderMakingContent();window.scrollTo({top:0,behavior:'smooth'});}
    function renderRedesignReview(){const candidate=state.makingWords.flatMap(word=>(word.suggestions||[]).map(item=>Object.assign({word:word.word},item))).find(item=>item.id===state.redesignReviewId);if(!candidate){state.redesignReviewId='';return renderMakingContent();}const metrics=[['meaningScore','의미 보존성','원래 표현의 의미가 잘 살아 있는가?'],['naturalScore','자연스러움','실제로 말할 때 자연스러운가?'],['universalScore','보편성','다양한 사람과 상황에서 두루 사용할 수 있는가?'],['clarityScore','명확성','뜻과 쓰임을 바로 이해할 수 있는가?']];document.getElementById('studentContent').innerHTML=`<button class="btn btn-block" onclick="state.redesignReviewId='';renderMakingContent()" style="margin-bottom:12px">← 설계안 등록으로 돌아가기</button><article class="student-card card"><p class="eyebrow">블라인드 동료 검토</p><h2>${esc(candidate.word)} → <span style="color:var(--accent)">${esc(candidate.suggestedWord)}</span></h2><p class="intent-copy"><b>전달하려는 의미</b>${esc(candidate.meaning)}</p><p class="intent-copy"><b>핵심 특징</b>${esc(candidate.coreFeature)}</p><p class="intent-copy"><b>제안 이유</b>${esc(candidate.reason)}</p>${metrics.map(([key,title,question])=>`<div class="review-metric" data-review-metric="${key}"><h3>${title}</h3><p>${question}</p><div class="score-scale">${[1,2,3,4,5].map(score=>`<button class="score-choice" type="button" onclick="selectReviewScore('${key}',${score},this)">${score}</button>`).join('')}</div></div>`).join('')}<button id="completeReviewBtn" class="btn btn-primary btn-lg btn-block" onclick="submitRedesignReview('${attr(candidate.id)}',this)" disabled>평가 완료</button></article>`;}
    function selectReviewScore(key,score,button){state.redesignReviewScores[key]=score;button.closest('[data-review-metric]').querySelectorAll('.score-choice').forEach(item=>item.classList.toggle('active',item===button));document.getElementById('completeReviewBtn').disabled=Object.keys(state.redesignReviewScores).length<4;}
    async function submitSuggestion(event){event.preventDefault();const button=event.submitter;const payload={diagnosticCardId:state.selectedDiagnosticId,meaning:document.getElementById('redesignMeaning').value,suggestedWord:document.getElementById('suggestedWord').value,reason:document.getElementById('suggestionReason').value,exampleSentence:document.getElementById('redesignExample').value};setButtonBusy(button,true,'저장 중...');try{await api('submitDiagnosticRedesign',state.anonId,payload);toast('새 표현을 등록했습니다. 4차시 비교에도 연결됩니다.','success');state.redesignCards=await api('getRedesignLesson',state.anonId,state.classInfo.id);state.makingWords=state.redesignCards;state.selectedDiagnosticId='';renderMakingContent();window.scrollTo({top:0,behavior:'smooth'});}catch(error){friendlyError(error);setButtonBusy(button,false);}}
    async function submitRedesignReview(id,button){if(Object.keys(state.redesignReviewScores).length<4)return toast('네 가지 항목을 모두 평가해 주세요.','error');setButtonBusy(button,true,'저장 중...');try{await api('saveSuggestionReview',state.anonId,id,state.redesignReviewScores);toast('평가를 완료했습니다.','success');state.makingWords=await api('getWordmakingWords',state.anonId,state.classInfo.id);state.redesignReviewId='';state.redesignReviewScores={};const next=getReviewableRedesigns()[0];if(next)state.redesignReviewId=next.id;renderMakingContent();window.scrollTo({top:0,behavior:'smooth'});}catch(error){friendlyError(error);setButtonBusy(button,false);}}

    /* ------------------------------ 블라인드 검증 · 공개 사전 ------------------------------ */
    async function renderDictionaryView(){
      setApp(studentHeader('4차시 · 1:1 검증','기존 표현과 새 표현 중 이 상황에 더 잘 어울리는 말을 골라요.'));
      document.getElementById('studentContent').innerHTML='<div class="empty">검증 항목을 불러오는 중...</div>';
      state.abAnswers={choice:''};
      try{[state.abLesson,state.publishedDictionary]=await Promise.all([api('getAbTestLesson',state.anonId,state.classInfo.id),api('getPublishedDictionary',state.anonId,state.classInfo.id)]);renderVerificationView();}catch(error){document.getElementById('studentContent').innerHTML=`<div class="empty">${esc(friendlyError(error))}</div>`;}
    }
    function renderVerificationView(){
      const root=document.getElementById('studentContent');const tests=(state.abLesson&&state.abLesson.tests)||[];const pending=tests.find(test=>!test.myResponse);const completed=tests.filter(test=>test.myResponse).length;
      if(pending){root.innerHTML=`<div class="lesson-tools"><div><h3>${completed+1} / ${tests.length} · 표현 비교</h3><p>더 적합한 표현 하나를 선택하세요.</p></div><span class="count">${completed}개 완료</span></div><article class="student-card card"><p class="eyebrow">이 상황에서 더 잘 어울리는 말은?</p><div class="ab-pair"><button type="button" class="ab-option ab-choice" onclick="selectComparisonChoice('A',this)"><small>기존 표현</small><strong>${esc(pending.originalWord)}</strong></button><span class="ab-vs">VS</span><button type="button" class="ab-option ab-choice" onclick="selectComparisonChoice('B',this)"><small>새 표현</small><strong>${esc(pending.redesignedWord)}</strong></button></div><p class="help">선택 결과는 우리 반 우리말 사전에 바로 반영됩니다.</p><button id="submitAbBtn" class="btn btn-primary btn-lg btn-block" onclick="submitComparisonVote('${attr(pending.id)}',this)" disabled>이 표현 선택</button></article>`;return;}
      const results=tests.length?`<section class="waiting-panel card"><div class="waiting-glyph">✓</div><h2>검증 완료</h2><p class="help">우리 반이 선택한 표제어를 아래 사전에서 확인해요.</p></section>`:'<div class="empty">3차시에서 새 표현이 등록되면 비교가 시작됩니다.</div>';
      root.innerHTML=results+`<div class="lesson-tools" style="margin-top:20px"><div><h3>우리 반 우리말 사전</h3><p>학급 선택 결과가 반영된 표제어입니다.</p></div><button class="btn" onclick="renderDictionaryView()" aria-label="새로고침">↻</button></div><input id="dictionarySearch" class="dictionary-search" type="search" placeholder="표제어 검색" value="${attr(state.dictionarySearch||'')}"><div id="dictionaryList" class="dictionary-list"></div>`;const search=document.getElementById('dictionarySearch');if(search)search.addEventListener('input',event=>{state.dictionarySearch=event.target.value;renderDictionaryList();});renderDictionaryList();
    }
    function selectComparisonChoice(choice,button){state.abAnswers={choice};document.querySelectorAll('.ab-pair .ab-choice').forEach(item=>item.classList.toggle('active',item===button));const submit=document.getElementById('submitAbBtn');if(submit)submit.disabled=false;}
    async function submitComparisonVote(testId,button){const choice=state.abAnswers&&state.abAnswers.choice;if(!choice)return toast('두 표현 중 하나를 선택해 주세요.','error');setButtonBusy(button,true,'반영 중...');try{const result=await api('saveComparisonVote',state.anonId,testId,choice);toast(result.winner==='동점'?'현재 선택 결과가 동점입니다.':'우리 반 사전에 ‘'+result.winner+'’이(가) 반영되었습니다.','success');state.abAnswers={choice:''};[state.abLesson,state.publishedDictionary]=await Promise.all([api('getAbTestLesson',state.anonId,state.classInfo.id),api('getPublishedDictionary',state.anonId,state.classInfo.id)]);renderVerificationView();window.scrollTo({top:0,behavior:'smooth'});}catch(error){friendlyError(error);setButtonBusy(button,false);}}
    function renderDictionaryList(){const root=document.getElementById('dictionaryList');if(!root)return;const query=String(state.dictionarySearch||'').trim().toLowerCase();const data=state.publishedDictionary||{};const list=(data.entries||[]).filter(item=>!query||item.originalWord.toLowerCase().includes(query)||item.finalWord.toLowerCase().includes(query));root.innerHTML=list.length?list.map((item,index)=>`<article class="dictionary-headword card"><span class="pronunciation">표제어 ${String(index+1).padStart(2,'0')} · ${esc(item.category)}</span><h2>${esc(item.finalWord)}</h2>${item.finalWord!==item.originalWord?`<p class="help">기존 표현 · ${esc(item.originalWord)}</p>`:''}<div class="definition"><p><b>1</b>${esc(item.meaning)}</p>${item.exampleSentence?`<p><b>예</b>${esc(item.exampleSentence)}</p>`:''}</div></article>`).join(''):`<div class="empty">${query?'검색 결과가 없습니다.':'검증 선택이 모이면 표제어가 나타납니다.'}</div>`;}
    function openDictionaryUsage(dictionaryId,word){openModal('실제 사용 기록',`<form id="dictionaryUsageForm"><p><b>${esc(word)}</b>을(를) 이번 주에 사용했군요.</p><label class="field-label" for="usageContext">어떤 상황에서 사용했나요? <span class="help">(선택)</span></label><textarea id="usageContext" maxlength="400" placeholder="예: 친구와 수행평가 이야기를 할 때"></textarea></form>`,`<button class="btn" onclick="closeModal()">취소</button><button id="saveUsageBtn" class="btn btn-primary" onclick="saveDictionaryUsage('${attr(dictionaryId)}')">기록하기</button>`);}
    async function saveDictionaryUsage(dictionaryId){const button=document.getElementById('saveUsageBtn');setButtonBusy(button,true,'저장 중...');try{await api('saveDictionaryUsage',state.anonId,dictionaryId,document.getElementById('usageContext').value);closeModal();toast('이번 주 실제 사용을 기록했습니다.','success');state.publishedDictionary=await api('getPublishedDictionary',state.anonId,state.classInfo.id);renderDictionaryList();}catch(error){friendlyError(error);setButtonBusy(button,false);}}

    /* ------------------------------ 공통 모달 / QR ------------------------------ */
    function openModal(title, body, footer, wide) {
      const modalClass = wide === 'fullscreen' ? 'fullscreen' : wide ? 'wide' : '';
      document.getElementById('modalRoot').innerHTML=`<div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><section class="modal ${modalClass}"><header class="modal-head"><h2 id="modalTitle">${esc(title)}</h2><button class="icon-btn" onclick="closeModal()" aria-label="닫기">×</button></header><div class="modal-body">${body}</div>${footer?`<footer class="modal-foot">${footer}</footer>`:''}</section></div>`;
      document.addEventListener('keydown',escapeModal); document.querySelector('.modal-layer').addEventListener('click',event=>{if(event.target.classList.contains('modal-layer'))closeModal();});
    }
    function closeModal(){const full=document.fullscreenElement;if(full&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});document.getElementById('modalRoot').innerHTML='';document.removeEventListener('keydown',escapeModal);}
    function escapeModal(event){if(event.key==='Escape'&&!document.fullscreenElement)closeModal();}
    function confirmModal(title,message,onConfirm,confirmLabel){openModal(title,`<p class="confirm-copy">${esc(message)}</p>`,`<button class="btn" onclick="closeModal()">취소</button><button id="confirmAction" class="btn btn-danger">${esc(confirmLabel||'확인')}</button>`);document.getElementById('confirmAction').addEventListener('click',onConfirm);}
    function openQr(url,title){
      openModal(title,`<p class="drag-hint">스캔하면 클래스 코드 입력 없이 이 차시 활동으로 바로 연결됩니다. PC에서는 창 위쪽을 잡아 옮길 수 있습니다.</p><div id="qrBox" class="qr-box"><span class="help">QR 코드를 만드는 중...</span></div><div class="url-box">${esc(url)}</div>`,`<button class="btn" onclick="closeModal()">QR 접기</button><button class="btn" onclick="copyUrl('${attr(url)}')">주소 복사</button><button class="btn btn-primary" onclick="toggleQrFull()">전체 화면</button>`,true);
      const layer=document.querySelector('.modal-layer');const modal=document.querySelector('.modal');if(layer)layer.classList.add('qr-layer');if(modal){modal.classList.add('qr-modal');enableQrDrag(modal);}
      setTimeout(()=>{const box=document.getElementById('qrBox');box.innerHTML='';if(window.QRCode){new QRCode(box,{text:url,width:460,height:460,colorDark:'#17383e',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}else{box.innerHTML='<p>QR 라이브러리를 불러오지 못했습니다.<br>아래 주소를 학생에게 공유해 주세요.</p>';}},0);
    }
    function enableQrDrag(modal){if(innerWidth<800||!matchMedia('(pointer:fine)').matches)return;const head=modal.querySelector('.modal-head');if(!head)return;const rect=modal.getBoundingClientRect();modal.classList.add('is-draggable');modal.style.left=rect.left+'px';modal.style.top=rect.top+'px';modal.style.width=rect.width+'px';let drag=null;head.addEventListener('pointerdown',event=>{if(event.button!==0||event.target.closest('button'))return;const current=modal.getBoundingClientRect();drag={x:event.clientX-current.left,y:event.clientY-current.top};head.setPointerCapture(event.pointerId);});head.addEventListener('pointermove',event=>{if(!drag)return;const maxLeft=Math.max(8,innerWidth-modal.offsetWidth-8);const maxTop=Math.max(8,innerHeight-70);modal.style.left=Math.min(maxLeft,Math.max(8,event.clientX-drag.x))+'px';modal.style.top=Math.min(maxTop,Math.max(8,event.clientY-drag.y))+'px';});const stop=()=>{drag=null;};head.addEventListener('pointerup',stop);head.addEventListener('pointercancel',stop);}
    async function copyUrl(url,label){const subject=label||'주소를';try{await navigator.clipboard.writeText(url);toast(subject+' 복사했습니다.','success');}catch(error){const area=document.createElement('textarea');area.value=url;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();toast(subject+' 복사했습니다.','success');}}
    function toggleQrFull(){const layer=document.querySelector('.modal-layer');const modal=layer&&layer.querySelector('.modal');if(document.fullscreenElement){if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});layer.classList.remove('qr-full');return;}if(!layer||!modal)return;modal.classList.remove('is-draggable');modal.style.left='';modal.style.top='';modal.style.width='';layer.classList.add('qr-full');if(layer.requestFullscreen)layer.requestFullscreen().catch(()=>{});}
  </script>
</body>
