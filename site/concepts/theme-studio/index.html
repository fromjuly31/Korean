<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#222425"><title>우리말 · 세 가지 테마</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23355d4e'/%3E%3Cpath d='M20 8v24M8 20h24M11.5 11.5l17 17M28.5 11.5l-17 17' stroke='%23f7f6f0' stroke-width='2'/%3E%3C/svg%3E">
  <style>
  @font-face{font-family:Preview;src:url('vendor/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}*{box-sizing:border-box}body{margin:0;background:#e7e8e8;color:#f7f7f7;font-family:Preview,sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b0cafe;outline-offset:3px}.preview-bar{background:#222425;padding:15px 24px;display:flex;align-items:center;gap:22px;min-height:77px}.preview-brand{font-size:12px;font-weight:700;white-space:nowrap}.preview-brand small{display:block;font-size:9px;color:#9faaa5;font-weight:400;margin-top:3px}.options{display:flex;gap:6px;margin:auto}.theme{background:transparent;border:1px solid #444847;color:#a8b0ac;padding:10px 17px;min-height:43px;border-radius:8px;font-size:12px;display:flex;gap:10px;align-items:center}.theme[aria-pressed=true]{background:#f5f5f0;color:#222425;border-color:#f5f5f0}.dot{width:9px;height:9px;border-radius:50%;background:#a6bea1}.theme:nth-child(2) .dot{background:#b9a9e7}.theme:nth-child(3) .dot{background:#ccef78}.tools{display:flex;align-items:center;gap:4px}.tools button,.tools a{color:#d5dbd8;background:none;border:0;text-decoration:none;min-width:39px;min-height:42px;padding:10px;font-size:17px;display:grid;place-items:center;border-radius:6px}.tools button:hover,.tools a:hover{background:#383b39}.tools button[aria-pressed=true]{background:#454d48}.view{height:calc(100svh - 77px);padding:0;display:flex;justify-content:center;overflow:hidden;transition:padding .25s}.view.mobile{padding:20px 12px}.view iframe{width:100%;height:100%;background:#f7f6f0;border:0;box-shadow:0 12px 40px #0002;transition:width .25s,border-radius .25s}.view.mobile iframe{width:390px;max-width:100%;border-radius:24px;border:7px solid #303533}.legend{display:none}@media(max-width:760px){.preview-bar{padding:12px;gap:12px;flex-wrap:wrap}.preview-brand{font-size:11px;flex:1}.preview-brand small{display:none}.options{order:3;width:100%;justify-content:stretch}.theme{flex:1;justify-content:center;padding:10px 8px;font-size:11px;gap:7px}.tools button,.tools a{min-height:32px;min-width:32px;padding:5px;font-size:16px}.view{height:calc(100svh - 111px)}.view.mobile{padding:12px}.tools .desktop-only{display:none}.preview-bar{min-height:111px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="preview-bar"><div class="preview-brand">우리말 / THEME STUDY<small>디자인 미리보기</small></div><nav class="options" aria-label="테마 선택"><button class="theme" type="button" data-theme="atelier" aria-pressed="true"><span class="dot"></span>01 말랑 공방</button><button class="theme" type="button" data-theme="orbit" aria-pressed="false"><span class="dot"></span>02 말의 우주</button><button class="theme" type="button" data-theme="play" aria-pressed="false"><span class="dot"></span>03 워드 플레이</button></nav><div class="tools"><button type="button" id="mobileToggle" class="desktop-only" aria-label="모바일 화면으로 보기" aria-pressed="false">▯</button><button type="button" id="motionToggle" aria-label="움직임 멈추기" aria-pressed="false">Ⅱ</button><a id="openPreview" href="preview.html?theme=atelier" target="_blank" rel="noopener" aria-label="시안 새 창으로 열기">↗</a></div></header>
  <main class="view"><iframe id="preview" src="preview.html?theme=atelier" title="말랑 공방 테마 미리보기"></iframe></main>
  <script>
  const themes={atelier:'말랑 공방',orbit:'말의 우주',play:'워드 플레이'};const frame=document.querySelector('#preview');let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function selectTheme(theme){if(!Object.hasOwn(themes,theme))return;document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));frame.src='preview.html?theme='+theme;frame.title=themes[theme]+' 테마 미리보기';document.querySelector('#openPreview').href=frame.src;history.replaceState(null,'','#'+theme);}
  document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>selectTheme(b.dataset.theme));if(themes[location.hash.slice(1)])selectTheme(location.hash.slice(1));
  document.querySelector('#mobileToggle').onclick=event=>{const enabled=document.querySelector('.view').classList.toggle('mobile');event.currentTarget.setAttribute('aria-pressed',String(enabled));event.currentTarget.setAttribute('aria-label',enabled?'PC 화면으로 보기':'모바일 화면으로 보기');};
  function sendMotion(){frame.contentWindow.postMessage({type:'preview-motion',paused},location.origin);}
  function updateMotion(){const button=document.querySelector('#motionToggle');button.textContent=paused?'▷':'Ⅱ';button.setAttribute('aria-pressed',String(paused));button.setAttribute('aria-label',paused?'움직임 재생':'움직임 멈추기');}updateMotion();
  document.querySelector('#motionToggle').onclick=()=>{paused=!paused;updateMotion();sendMotion();};frame.onload=sendMotion;
  window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===frame.contentWindow&&event.data?.type==='preview-ready')sendMotion();});
  </script>
</body>
</html>
